ccent,var(--green));font-size:9px;font-weight:850}.animal-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;color:var(--muted);font-size:10px}.animal-card-meta span{padding:4px 6px;border-radius:6px;background:#ffffff78}.cattle-grid.animals-list{grid-template-columns:1fr;gap:9px}.animals-list .animal-card{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(190px,.72fr) minmax(210px,.72fr) auto;align-items:center;gap:14px;padding:13px 16px}.animals-list .animal-stat{margin:0;padding:0;border:0}.animals-list .animal-card-meta{margin:0}.animals-list .animal-delete{margin:0;white-space:nowrap}.empty-animals{grid-column:1/-1;padding:34px;text-align:center;border:1px dashed #b9cbbd;border-radius:14px;background:#fff;color:var(--muted)}.empty-animals b{display:block;margin-bottom:3px;color:var(--ink)}.scale-help{margin-bottom:15px;padding:12px 14px;border:1px solid #cfe4d1;border-radius:12px;background:linear-gradient(135deg,#f1f8f2,#fff);color:#365c3e;font-size:11px}.scale-help strong{display:block;margin-bottom:2px;font-size:12px}.species-avatar{background:#fff;border:1px solid #d9e5da}.profile-species{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 8px;border-radius:99px;background:#f2f7f2;color:var(--green);font-size:10px;font-weight:850}

<body>
  <div id="app"></div>
  <div class="modal" id="modal"><div class="modal-box" role="dialog" aria-modal="true"><h2 id="modal-title"></h2><p id="modal-copy"></p><form class="form" id="modal-form"></form></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    const KEY='herdcare-working-prototype-v1';
    const demo={selected:'GV-042',sensorOn:true,cattle:[{id:'GV-042',name:'Bella',type:'Dairy cow',breed:'Holstein',age:'4 years',weight:'546 kg',lastCalved:'14 May',temp:39.6,usual:38.9,photo:'',notes:[{date:'Today, 09:41',title:'Photo health check added',detail:'Automated visual observation saved; eye area marked for review.',label:'New'},{date:'Sep 2, 17:30',title:'Temperature trend elevated',detail:'Connected sensor reading reached 39.4°C.',label:'Monitor'},{date:'Aug 28, 10:15',title:'Routine wellness entry',detail:'Appetite and activity reported as normal.',label:'Normal'}],diet:[['Morning feed','18 kg','Green fodder'],['Concentrate','5 kg','Dairy mix'],['Water target','75 L','Fresh water'],['Supplement','60 g','Mineral mix']],meds:[{name:'Mineral supplement',detail:'60 g with evening feed',due:'Today'},{name:'FMD vaccination',detail:'Next dose due 18 Sep',due:'15 days'}]}],vets:[{name:'Dr. Ananya Sharma',clinic:'Green Cross Veterinary Clinic',address:'12 Farm Road, Green Valley',phone:'+919800123456',distance:'1.8 km',open:'Open now',emoji:'👩🏽‍⚕️',emergency:false},{name:'Dr. Vikram Rao',clinic:'District Animal Hospital',address:'Market Road, Green Valley',phone:'+919800789012',distance:'3.2 km',open:'24-hour service',emoji:'👨🏾‍⚕️',emergency:true},{name:'Dr. Meera Patel',clinic:'Rural Livestock Care',address:'Highway 7, Green Valley',phone:'+919800456789',distance:'4.5 km',open:'Open until 20:00',emoji:'👩🏽‍⚕️',emergency:false}]};
    let state;try{state=JSON.parse(localStorage.getItem(KEY))||demo}catch{state=demo}
    const PAGES=['overview','cattle','history','sensor','diet','vets'];
    let page=PAGES.includes(location.hash.slice(1))?location.hash.slice(1):'overview';
    const app=document.getElementById('app'),modal=document.getElementById('modal'),toast=document.getElementById('toast');
    const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
    const median=values=>{const sorted=values.filter(Number.isFinite).sort((a,b)=>a-b);if(!sorted.length)return NaN;const middle=Math.floor(sorted.length/2);return sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2};
    const esc=x=>String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const now=()=>new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const speciesCatalog={Dog:{emoji:'🐕',normal:38.6,group:'Home pets'},Cat:{emoji:'🐈',normal:38.4,group:'Home pets'},Cow:{emoji:'🐄',normal:38.9,group:'Cattle group'},Buffalo:{emoji:'🐃',normal:38.5,group:'Buffalo group'},Goat:{emoji:'🐐',normal:39.2,group:'Goat group'},Sheep:{emoji:'🐑',normal:39.1,group:'Small ruminants'},Other:{emoji:'🐾',normal:38.8,group:'Other animals'}};
    const inferSpecies=c=>{const text=`${c.species||''} ${c.type||''} ${c.breed||''}`.toLowerCase();return text.includes('buffalo')?'Buffalo':text.includes('goat')?'Goat':text.includes('sheep')?'Sheep':text.includes('dog')?'Dog':text.includes('cat')?'Cat':text.includes('cow')||text.includes('cattle')?'Cow':'Other'};
    const speciesMeta=value=>speciesCatalog[value]||speciesCatalog.Other;
    const starterSamples=[
      {id:'HOME-DOG-01',name:'Bruno',species:'Dog',type:'Companion dog',breed:'Indian Pariah',age:'3 years',weight:'21 kg',group:'Home pets',temp:38.7,usual:38.6,notes:[{date:'Today, 08:10',title:'Morning check',detail:'Appetite, walk and activity normal.',label:'Normal'}],diet:[['Morning meal','1 serving','Balanced dog food'],['Water','Always available','Fresh water']],meds:[]},
      {id:'HOME-CAT-01',name:'Misti',species:'Cat',type:'Companion cat',breed:'Domestic shorthair',age:'2 years',weight:'4.2 kg',group:'Home pets',temp:38.5,usual:38.4,notes:[{date:'Yesterday, 19:30',title:'Behaviour check',detail:'Eating and grooming normally.',label:'Normal'}],diet:[['Daily meals','3 small meals','Balanced cat food'],['Water','Always available','Fresh water']],meds:[]},
      {id:'GV-BF-07',name:'Gauri',species:'Buffalo',type:'Dairy buffalo',breed:'Murrah',age:'5 years',weight:'575 kg',group:'Buffalo group',temp:38.7,usual:38.5,notes:[{date:'Today, 07:15',title:'Milking check',detail:'Feed intake and movement normal.',label:'Normal'}],diet:[['Green fodder','22 kg','Seasonal fodder'],['Water target','80 L','Fresh water']],meds:[]},
      {id:'GV-GT-18',name:'Tara',species:'Goat',type:'Dairy goat',breed:'Jamunapari',age:'2 years',weight:'42 kg',group:'Goat group',temp:39.3,usual:39.2,notes:[{date:'Today, 07:40',title:'Group observation',detail:'Active with normal appetite.',label:'Normal'}],diet:[['Browse & fodder','4 kg','Mixed forage'],['Water','6 L','Fresh water']],meds:[]}
    ];
    const normalizeState=()=>{
      state.weather={name:'New Delhi (demo)',latitude:28.6139,longitude:77.209,current:null,apparent:null,humidity:null,high:null,low:null,hours:[],updated:null,status:'idle',...(state.weather||{})};
      state.workspace={name:'Green Valley Care',mode:'mixed',...(state.workspace||{})};
      if(!state.schemaVersion&&state.cattle?.length===1&&state.cattle[0]?.id==='GV-042')state.cattle.push(...starterSamples.map(item=>({...item,photo:''})));
      state.schemaVersion=2;
      state.cattle=(state.cattle||[]).map(c=>{
        c.notes=c.notes||[];c.diet=c.diet||[];c.meds=c.meds||[];
        c.species=c.species||inferSpecies(c);c.group=c.group||speciesMeta(c.species).group;c.type=c.type||c.species;c.photo=c.photo||'';
        c.sensorType=c.sensorType||'surface';c.referenceAmbient=Number.isFinite(c.referenceAmbient)?c.referenceAmbient:25;c.ambientSensitivity=Number.isFinite(c.ambientSensitivity)?c.ambientSensitivity:.035;
        if(!Array.isArray(c.readings)||!c.readings.length){const seed=[c.usual-.1,c.usual,c.usual+.1,c.temp-.2,c.temp];c.readings=seed.map((raw,index)=>({at:new Date(Date.now()-(seed.length-1-index)*15*60000).toISOString(),raw:Number(raw.toFixed(1)),ambient:25,apparent:25,source:index===seed.length-1?'sensor':'history'}))}
        return c;
      });
      state.animalView=state.animalView||(state.cattle.length>12?'list':'cards');
    };
    normalizeState();
    localStorage.setItem(KEY,JSON.stringify(state));
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const animal=()=>state.cattle.find(c=>c.id===state.selected)||state.cattle[0];
    const effectiveAmbient=reading=>Number.isFinite(reading?.ambient)?(.7*reading.ambient+.3*(Number.isFinite(reading.apparent)?reading.apparent:reading.ambient)):25;
    const correctReading=(reading,c)=>{const raw=Number(reading?.raw);if(c.sensorType!=='surface'||!Number.isFinite(raw))return raw;const bias=clamp((effectiveAmbient(reading)-c.referenceAmbient)*c.ambientSensitivity,-.6,.6);return raw-bias};
    function temperatureAnalysis(c){
      const live={raw:Number(c.temp),ambient:state.weather.current,apparent:state.weather.apparent};
      const corrected=correctReading(live,c);
      const recent=(c.readings||[]).slice(-5).map(reading=>correctReading(reading,c)).filter(Number.isFinite);
      const smoothed=Number.isFinite(median(recent))?median(recent):corrected;
      const stable=recent.filter(value=>Math.abs(value-c.usual)<=.5);
      const predicted=clamp(.8*c.usual+.2*(Number.isFinite(median(stable))?median(stable):c.usual),c.usual-.2,c.usual+.2);
      const optimized=.72*corrected+.28*smoothed;
      const delta=optimized-predicted;
      const recentDeltas=recent.slice(-3).map(value=>value-predicted);
      const persistent=recentDeltas.length===3&&recentDeltas.every(value=>Math.abs(value)>=.35)&&recentDeltas.every(value=>Math.sign(value)===Math.sign(recentDeltas[0]));
      const level=c.temp>=40||c.temp<=37.5||Math.abs(delta)>=.9?'urgent':Math.abs(delta)>=.45||persistent?'monitor':'stable';
      const bias=Number(c.temp)-corrected;
      return{raw:Number(c.temp),corrected,smoothed,predicted,optimized,delta,bias,persistent,level};
    }
    const wellness=c=>{const a=temperatureAnalysis(c),records=(c.notes||[]).slice(0,8),temperatureRisk=Math.max(0,Math.abs(a.delta)-.2)*22,recordRisk=Math.min(16,records.reduce((sum,n)=>sum+(/urgent/i.test(n.label)?12:/monitor|review/i.test(n.label)?4:0),0)),behaviourRisk=records.some(n=>/reduced appetite|not eating|inactive|letharg|restless|aggress|isolat|limp|cough|diarr|weak|marked for review/i.test(`${n.title} ${n.detail}`))?4:0;return clamp(Math.round(96-temperatureRisk-recordRisk-behaviourRisk),40,98)};
    const wellnessBand=score=>score>85?{key:'green',label:'Stable range'}:score>=75?{key:'yellow',label:'Watch closely'}:score>=60?{key:'orange',label:'Needs attention'}:{key:'red',label:'High concern'};
    const status=c=>({urgent:'Urgent veterinary attention',monitor:'Monitoring irregular pattern',stable:'Looks stable'})[temperatureAnalysis(c).level];
    const image=c=>c.photo?`<img src="${c.photo}" alt="${esc(c.name)} health-check photo">`:speciesMeta(c.species).emoji;
    const nav=[['overview','▦','Overview'],['cattle','🐾','My animals'],['history','◔','Health records'],['sensor','♨','Temperature & sensors'],['diet','🥬','Diet & medicines'],['vets','⚕','Find a vet']];
    const goPage=next=>{page=next;window.history.replaceState(null,'',`#${next}`);render()};
    function frame(content,title,subtitle,tools=''){const modeLabel={home:'Home & pets',mixed:'Mixed animal care',farm:'Farm & herd'}[state.workspace.mode]||'Mixed animal care';app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">✚</div>HerdCare</div><div class="farm"><small>ACTIVE CARE SPACE</small><strong>${esc(state.workspace.name)}</strong><span>${modeLabel} · ${state.cattle.length} animals</span></div><nav class="nav">${nav.map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="side-foot">${state.sensorOn?'● Monitoring active':'○ Monitoring paused'}<br><strong>${state.sensorOn?'Records & sensors syncing':'Manual entry mode'}</strong></div></aside><main class="main"><header class="top"><div><div class="eyebrow">${page==='overview'?'Animal care overview':'HerdCare'}</div><h1>${title}</h1><p>${subtitle}</p></div>${tools}</header>${content}<p class="footer">HerdCare supports animal monitoring and recordkeeping for homes and farms. It does not replace examination by a qualified veterinarian.</p></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>goPage(b.dataset.page))}
    function vetRow(v){return `<div class="vet"><div class="vet-avatar">${v.emoji}</div><div><strong>${esc(v.name)} <span style="color:#b87017">• ${esc(v.distance)}</span></strong><small>${esc(v.clinic)} · ${esc(v.open)}</small></div><div class="vet-actions"><a class="round" href="tel:${esc(v.phone)}" title="Call ${esc(v.name)}">☎</a><a class="round alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.address)}" title="Directions">↗</a></div></div>`}
    function mapGate(place,label){return `<div class="map map-gate" data-map-place="${esc(place)}" data-map-label="${esc(label)}"><div class="road a"></div><div class="road b"></div><div class="road c"></div><div class="park"></div><div class="pin a"></div><div class="pin b"></div><div class="pin c"></div><button class="map-load" type="button" data-load-map><span>▦</span> Load interactive Google Map</button></div>`}
    function bindMapGates(){document.querySelectorAll('[data-load-map]').forEach(button=>button.onclick=()=>{const map=button.closest('[data-map-place]'),place=map.dataset.mapPlace,label=map.dataset.mapLabel,frame=document.createElement('iframe'),status=document.createElement('div');button.disabled=true;status.className='map-status';status.textContent='Loading Google Maps…';frame.title=label;frame.loading='eager';frame.referrerPolicy='no-referrer-when-downgrade';frame.allowFullscreen=true;map.className='map map-live';map.replaceChildren(status,frame);frame.onload=()=>status.remove();frame.src=`https://www.google.com/maps?q=${encodeURIComponent(place)}&output=embed`;setTimeout(()=>{if(status.isConnected)status.innerHTML=`Map is taking longer than expected. <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">Open Google Maps ↗</a>`},8000)})}
    function overview(){
      const c=animal(),a=temperatureAnalysis(c),score=wellness(c),warning=a.level!=='stable';
      const alert=`<div class="alerts"><div class="alert ${a.level==='urgent'?'urgent':''}"><div class="alert-icon">!</div><div><strong>${warning?'Review the sustained temperature pattern':'Continue routine monitoring'}</strong><p>${warning?'Compare behaviour, appetite and a clinical temperature check; weather correction never replaces direct examination.':`${esc(c.name)}’s optimized reading is close to the predicted individual baseline.`}</p></div></div></div>`;
      const html=`${warning?`<div class="notice"><div class="notice-dot"></div><div><strong>Irregular temperature pattern detected.</strong> Optimized ${a.optimized.toFixed(1)}°C is ${Math.abs(a.delta).toFixed(1)}°C ${a.delta>=0?'above':'below'} the predicted normal. Raw sensor data remains visible for safety.</div></div>`:''}<div class="dashboard"><div class="stack"><section class="card profile"><div class="profile-head"><div class="avatar">${image(c)}</div><div class="identity"><h2>${esc(c.name)}</h2><p>ID: ${esc(c.id)} &nbsp;•&nbsp; ${esc(c.species)} &nbsp;•&nbsp; ${esc(c.group)}</p><span class="profile-species">${speciesMeta(c.species).emoji} ${esc(c.type)}</span><span class="tag">● ${status(c)}</span></div></div><div class="profile-bottom"><div class="score"><div class="score-ring" style="background:conic-gradient(var(--green) 0 ${score*3.6}deg,#e7ece7 ${score*3.6}deg)"><b>${score}%</b></div><div><strong>Estimated wellness</strong><small>Temperature, records and behaviour.</small></div></div><div class="details"><div><small>Species</small><b>${esc(c.species)}</b></div><div><small>Breed</small><b>${esc(c.breed)}</b></div><div><small>Age</small><b>${esc(c.age)}</b></div><div><small>Group / home</small><b>${esc(c.group)}</b></div></div></div></section><section class="card section"><div class="head"><h2>Optimized body temperature</h2><button class="link" data-go="sensor">Weather + sensor details</button></div><div class="temp"><div class="temp-main"><b>${a.optimized.toFixed(1)}<span>°C</span></b><small>${a.delta>=0?'↑':'↓'} ${Math.abs(a.delta).toFixed(1)}°C from predicted normal</small><span style="display:block;margin-top:5px;color:var(--muted);font-size:10px">Raw ${a.raw.toFixed(1)}°C · ${Number.isFinite(state.weather.current)?state.weather.current.toFixed(1)+'°C outside':'weather pending'}</span></div><div class="trend"><svg viewBox="0 0 390 82" preserveAspectRatio="none"><path d="M0 62 C25 55,36 60,57 54 S89 68,112 56 S143 52,164 48 S193 54,216 43 S245 46,266 33 S294 42,315 26 S350 32,365 17 S380 22,390 12" fill="none" stroke="${warning?'#b87017':'#216b46'}" stroke-width="3"/><circle cx="390" cy="12" r="4" fill="${warning?'#b87017':'#216b46'}"/></svg><div class="trend-labels"><span>Earlier</span><span>Trend</span><span>Recent</span><span>Now</span></div></div></div></section><section class="card section"><div class="head"><h2>Photo health check</h2><button class="link" data-action="photo">Upload photo</button></div><div class="photo-check"><div class="photo-preview">${image(c)}<small>${c.photo?'Latest photo · saved locally':'No photo uploaded'}</small></div><div class="checklist"><div class="check">Photo is stored in this animal’s record</div><div class="check">AI integration point ready for a vision service</div><div class="check warn">Demo observation: verify visible changes in person</div><button class="link" data-action="note">Add observation →</button></div></div></section><section class="card section"><div class="head"><h2>Recent health record</h2><button class="link" data-go="history">View all history</button></div><div class="log">${c.notes.slice(0,3).map(n=>`<div class="log-row"><div class="date">${esc(n.date)}</div><div><strong>${esc(n.title)}</strong><p>${esc(n.detail)}</p></div><span class="mini">${esc(n.label)}</span></div>`).join('')}</div></section></div><div class="stack right"><section class="card section"><div class="head"><h2>Care actions</h2><button class="link" data-go="vets">Contact vet</button></div>${alert}</section><section class="card section"><div class="head"><h2>Today’s diet</h2><button class="link" data-go="diet">Edit plan</button></div><div class="diet-grid">${c.diet.length?c.diet.map(d=>`<div class="diet-item"><small>${esc(d[0])}</small><b>${esc(d[1])}</b><br><span>${esc(d[2])}</span></div>`).join(''):'<p class="small-note">No diet plan yet. Add one for this animal.</p>'}</div></section><section class="card section"><div class="head"><h2>Medication & reminders</h2><button class="link" data-go="diet">Manage</button></div>${c.meds.length?c.meds.map(m=>`<div class="med"><div class="med-icon">◒</div><div><strong>${esc(m.name)}</strong><small>${esc(m.detail)}</small></div><div class="due">${esc(m.due)}</div></div>`).join(''):'<p class="small-note">No active reminders.</p>'}</section><section class="card section vets-card"><div class="head"><h2>Nearby veterinarians</h2><button class="link" data-go="vets">View all</button></div>${mapGate(state.vets[0].address,'Nearest veterinary clinic map')}${state.vets.slice(0,2).map(vetRow).join('')}</section></div></div>`;
      frame(html,'Good morning, Rohan',`Here’s ${c.name}’s health picture across your ${state.cattle.length}-animal care space.`,`<div class="tools"><button class="button ghost" data-action="note">+ Add health note</button><button class="button primary ai-photo-top-tab" data-action="photo"><span aria-hidden="true">✦</span> AI Photo Check</button></div>`);bind();bindMapGates();
    }
    function cattle(){
      const animals=state.cattle,species=[...new Set(animals.map(c=>c.species))].sort(),groups=[...new Set(animals.map(c=>c.group))].sort(),needsAttention=animals.filter(c=>wellness(c)<75).length;
      const legend=`<div class="wellness-legend" aria-label="Wellness colour scale"><span class="legend-green"><i></i>Green · above 85%</span><span class="legend-yellow"><i></i>Yellow · 75–85%</span><span class="legend-orange"><i></i>Orange · 60–under 75%</span><span class="legend-red"><i></i>Red · below 60%</span></div>`;
      const modes=`<div class="care-scale" aria-label="Care scale"><button data-care-mode="home" class="${state.workspace.mode==='home'?'active':''}">🏠 Home & pets</button><button data-care-mode="mixed" class="${state.workspace.mode==='mixed'?'active':''}">🌿 Mixed animals</button><button data-care-mode="farm" class="${state.workspace.mode==='farm'?'active':''}">▦ Herd / farm</button></div>`;

      const toolbar=`<div class="animal-toolbar"><input id="animal-search" type="search" autocomplete="off" placeholder="Search name, ID, breed or group"><select id="species-filter" aria-label="Filter by species"><option value="">All species</option>${species.map(value=>`<option value="${esc(value)}">${speciesMeta(value).emoji} ${esc(value)}</option>`).join('')}</select><select id="group-filter" aria-label="Filter by group"><option value="">All groups / homes</option>${groups.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('')}</select><div class="view-toggle" aria-label="Animal view"><button data-animal-view="cards" class="${state.animalView==='cards'?'active':''}">▦ Cards</button><button data-animal-view="list" class="${state.animalView==='list'?'active':''}">☷ List</button></div></div>`;
      const help={home:'A simple card view for dogs, cats and a few companion animals.',mixed:'Keep pets, cows, buffalo, goats and other animals together—organized by home, pen or group.',farm:'Compact list view, search and group filters stay responsive for hundreds of animal records.'}[state.workspace.mode];
      frame(`${modes}<div class="scale-help"><strong>One care space, sized for you</strong>${help}</div>${summary}${legend}<div class="animal-actions"><button class="button primary" data-action="add-cattle">+ Add animal</button><button class="button ghost" data-action="bulk-add">＋ Add a group in bulk</button></div>${toolbar}<p class="animal-count-note" id="animal-count-note"></p><div class="cattle-grid ${state.animalView==='list'?'animals-list':''}" id="animal-results"></div>`,'My animals','Care for one pet, a mixed village holding, or a large multi-breed herd from the same friendly workspace.');

      const renderResults=()=>{const query=document.getElementById('animal-search').value.toLowerCase().trim(),speciesValue=document.getElementById('species-filter').value,groupValue=document.getElementById('group-filter').value;const filtered=animals.filter(c=>(!speciesValue||c.species===speciesValue)&&(!groupValue||c.group===groupValue)&&(!query||`${c.name} ${c.id} ${c.species} ${c.breed} ${c.group}`.toLowerCase().includes(query)));const shown=filtered.slice(0,120);root.className=`cattle-grid ${state.animalView==='list'?'animals-list':''}`;root.innerHTML=shown.length?shown.map(c=>animalCard(c,state.animalView)).join(''):`<div class="empty-animals"><b>No matching animals</b>Try a different search or add a new animal profile.</div>`;countNote.textContent=`Showing ${shown.length.toLocaleString()} of ${filtered.length.toLocaleString()} matching animals${filtered.length>120?' · refine the filters to find the rest':''}`;bindAnimalCards()};

    function history(){const c=animal();frame(`<div class="two-col"><section class="card wide-card"><div class="head"><h2>${esc(c.name)}’s health history</h2><button class="button primary" data-action="note">+ New record</button></div>${c.notes.map(n=>`<div class="history-row"><div class="timeline-date">${esc(n.date)}</div><div><h3>${esc(n.title)}</h3><p>${esc(n.detail)}</p></div><span class="mini">${esc(n.label)}</span></div>`).join('')}</section><aside class="card info"><h2>What to log</h2><p>Use this record for temperature changes, appetite, water intake, behaviour, visible symptoms, treatments and veterinary visits.</p><p>Well-kept records help a veterinarian understand the animal’s history quickly.</p></aside></div>`,'Health history',`Every entry for ${c.name} is saved on this device.`);bind()}
    const weatherIcon=code=>code===0?'☀️':code<=3?'⛅':code<=48?'🌫️':code<=67?'🌧️':code<=77?'🌨️':code<=82?'🌦️':'⛈️';
    const formatHour=value=>new Date(value).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    function chartFor(c,a){
      const readings=(c.readings||[]).slice(-12),raw=readings.map(r=>Number(r.raw)),adjusted=readings.map(r=>correctReading(r,c));
      const values=[...raw,...adjusted,a.predicted].filter(Number.isFinite),min=Math.min(...values)-.2,max=Math.max(...values)+.2,span=max-min||1;
      const points=series=>series.map((value,index)=>`${readings.length===1?380:index/(readings.length-1)*760+15},${155-(value-min)/span*125}`).join(' ');
      const baselineY=155-(a.predicted-min)/span*125;
      return `<div class="temperature-chart"><svg viewBox="0 0 790 170" preserveAspectRatio="none" role="img" aria-label="Raw and weather-adjusted temperature history"><line x1="15" x2="775" y1="${baselineY}" y2="${baselineY}" stroke="#9aa89d" stroke-width="2" stroke-dasharray="6 6"/><polyline points="${points(raw)}" fill="none" stroke="#b87017" stroke-width="3"/><polyline points="${points(adjusted)}" fill="none" stroke="#216b46" stroke-width="4"/>${adjusted.map((value,index)=>`<circle cx="${readings.length===1?380:index/(readings.length-1)*760+15}" cy="${155-(value-min)/span*125}" r="3" fill="#216b46"/>`).join('')}</svg><div class="chart-legend"><span><i style="background:#b87017"></i>Raw sensor</span><span><i style="background:#216b46"></i>Weather-corrected</span><span><i style="background:#9aa89d"></i>Predicted normal ${a.predicted.toFixed(1)}°C</span></div></div>`;
    }
    async function fetchJson(url,timeoutMs=6000){
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
      try{const response=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error('Service unavailable');return await response.json()}
      catch(error){if(error.name==='AbortError')throw new Error('Request timed out');throw error}
      finally{clearTimeout(timer)}
    }
    async function fetchWeather(latitude=state.weather.latitude,longitude=state.weather.longitude,name=state.weather.name){
      state.weather.status='loading';save();const statusNode=document.getElementById('weather-status');if(statusNode)statusNode.textContent='Updating forecast…';
      try{
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(latitude)}&longitude=${encodeURIComponent(longitude)}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&hourly=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=2&timezone=auto`;
        const data=await fetchJson(url);
        const start=Math.max(0,data.hourly.time.findIndex(value=>value>=data.current.time));
        const hours=data.hourly.time.slice(start,start+6).map((time,index)=>({time,temp:data.hourly.temperature_2m[start+index],apparent:data.hourly.apparent_temperature[start+index],code:data.hourly.weather_code[start+index]}));
        state.weather={...state.weather,name,latitude,longitude,current:data.current.temperature_2m,apparent:data.current.apparent_temperature,humidity:data.current.relative_humidity_2m,code:data.current.weather_code,high:data.daily.temperature_2m_max[0],low:data.daily.temperature_2m_min[0],hours,updated:new Date().toISOString(),attemptedAt:new Date().toISOString(),status:'ready',lastError:null};save();if(page==='sensor')sensor();return true;
      }catch(error){state.weather.status=state.weather.updated?'stale':'error';state.weather.attemptedAt=new Date().toISOString();state.weather.lastError=error.message;save();if(statusNode)statusNode.textContent=state.weather.updated?'Forecast refresh timed out — showing the last saved forecast.':'Forecast timed out — temperature records remain available.';toastMsg('Weather update timed out. Try Refresh when the connection improves.');return false}
    }
    async function searchPlace(query){const data=await fetchJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);const result=data.results?.[0];if(!result)throw new Error('Place not found');const name=[result.name,result.admin1,result.country].filter(Boolean).join(', ');await fetchWeather(result.latitude,result.longitude,name)}
    function sensor(){
      const c=animal(),a=temperatureAnalysis(c),weather=state.weather;
      const forecast=weather.hours?.length?weather.hours.map(hour=>`<div class="forecast-hour"><time>${formatHour(hour.time)}</time><b>${weatherIcon(hour.code)} ${Number(hour.temp).toFixed(0)}°</b><small>Feels ${Number(hour.apparent).toFixed(0)}°</small></div>`).join(''):'<p class="small-note">Forecast will appear after the first weather update.</p>';
      const statusText=a.level==='urgent'?'Raw or optimized temperature is far from the animal’s predicted normal. Confirm promptly with a clinical thermometer and contact a veterinarian.':a.level==='monitor'?'A sustained irregular pattern is emerging after weather correction. Continue close observation and verify if it persists.':'Optimized readings are close to this animal’s predicted normal pattern.';
      const rows=(c.readings||[]).slice(-8).reverse().map(reading=>{const adjusted=correctReading(reading,c);return `<tr><td>${new Date(reading.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${Number(reading.raw).toFixed(1)}°C</td><td>${Number.isFinite(reading.ambient)?Number(reading.ambient).toFixed(1)+'°C':'—'}</td><td>${Number(adjusted).toFixed(1)}°C</td></tr>`}).join('');
      const html=`<div class="thermal-summary"><article class="card thermal-metric"><small>Predicted normal</small><b>${a.predicted.toFixed(1)}°C</b><span>Individual rolling baseline</span></article><article class="card thermal-metric"><small>Raw thermal sensor</small><b>${a.raw.toFixed(1)}°C</b><span>Never hidden or overwritten</span></article><article class="card thermal-metric weather"><small>Local forecast now</small><b>${Number.isFinite(weather.current)?weatherIcon(weather.code)+' '+weather.current.toFixed(1)+'°C':'—'}</b><span>${esc(weather.name)}${Number.isFinite(weather.apparent)?' · feels '+weather.apparent.toFixed(1)+'°C':''}</span></article><article class="card thermal-metric primary"><small>Optimized reading</small><b>${a.optimized.toFixed(1)}°C</b><span>${a.delta>=0?'+':''}${a.delta.toFixed(1)}°C vs predicted normal</span></article></div><div class="thermal-status ${a.level}"><strong>${a.level==='stable'?'Pattern stable':a.level==='monitor'?'Monitor irregular pattern':'Urgent verification needed'}</strong><br>${statusText}</div><div class="two-col"><section class="card wide-card"><div class="head"><h2>Continuous temperature pattern</h2><span class="mini">${state.sensorOn?'LIVE':'PAUSED'}</span></div>${chartFor(c,a)}<div class="head" style="margin-top:24px"><h2>Next hours near ${esc(weather.name)}</h2><button class="link" id="refresh-weather">Refresh</button></div><div class="forecast-strip">${forecast}</div><p class="weather-credit" id="weather-status">${weather.status==='loading'?'Updating forecast…':weather.status==='stale'?'Forecast refresh timed out — showing the last saved forecast.':weather.status==='error'?'Forecast timed out — temperature records remain available.':weather.updated?`Updated ${new Date(weather.updated).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${weather.low.toFixed(0)}–${weather.high.toFixed(0)}°C today · ${weather.humidity}% humidity`:'Waiting for forecast'} · Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.</p></section><aside class="card info"><h2>Local weather</h2><p>Search the farm’s place or use this device’s location. The forecast is matched to every new sensor sample.</p><form class="weather-tools" id="city-form"><input name="city" required placeholder="Town, district or village"><button class="button ghost" type="submit">Use place</button></form><button class="button ghost" id="use-location" style="width:100%;margin-top:8px">◎ Use current location</button><h2 style="margin-top:22px">Add sensor sample</h2><form class="form" id="temp-form"><label>Raw sensor temperature (°C)<input name="temp" type="number" min="35" max="45" step="0.1" value="${c.temp.toFixed(1)}" required></label><label>Predicted normal baseline (°C)<input name="usual" type="number" min="35" max="45" step="0.1" value="${c.usual.toFixed(1)}" required></label><label>Measurement type<select name="sensorType"><option value="surface" ${c.sensorType==='surface'?'selected':''}>Surface / wearable thermal sensor</option><option value="core" ${c.sensorType==='core'?'selected':''}>Contact / core thermometer</option></select></label><label>Ambient sensitivity (°C correction per 1°C)<input name="sensitivity" type="number" min="0" max="0.08" step="0.005" value="${c.ambientSensitivity.toFixed(3)}"></label><button class="button primary" type="submit">Save and optimize reading</button></form><div class="sensor-control" style="margin-top:16px"><button class="switch ${state.sensorOn?'on':''}" id="sensor-switch" aria-label="Toggle sensor"></button><div><b style="font-size:12px">Sensor connection</b><small style="display:block;color:var(--muted);font-size:10px">${state.sensorOn?'Connected and syncing':'Paused — manual entry mode'}</small></div></div><p class="sensor-type-note">Weather correction is applied only to surface/wearable readings. Contact/core readings are preserved without ambient subtraction. The correction is capped at ±0.6°C, and a raw extreme can still trigger an alert.</p></aside></div><div class="two-col" style="margin-top:20px"><section class="card wide-card"><div class="head"><h2>Recent monitored data</h2><span class="mini">${c.readings.length} samples</span></div><div style="overflow:auto"><table class="stream"><thead><tr><th>Time</th><th>Raw sensor</th><th>Local weather</th><th>Corrected</th></tr></thead><tbody>${rows}</tbody></table></div></section><aside class="card info"><h2>How the reading is optimized</h2><ol class="method-list"><li><b>1 · Predicted normal</b>Starts with this animal’s usual temperature and recent stable samples.</li><li><b>2 · Weather correction</b>Uses current air and apparent temperature to estimate ambient bias for a surface sensor.</li><li><b>3 · Continuous pattern</b>Uses a five-sample median to reduce isolated spikes without deleting raw data.</li><li><b>4 · Early signal</b>Flags a large deviation or three consecutive smaller deviations in the same direction.</li></ol><p class="small-note">Normal ranges vary by species, age, measurement site and clinical context. Configure baselines with a veterinarian. <a href="https://www.merckvetmanual.com/multimedia/table/normal-rectal-temperature-ranges" target="_blank" rel="noopener">Reference table ↗</a></p></aside></div>`;
      frame(html,'Temperature intelligence',`Weather-adjusted continuous monitoring for ${c.name}, with raw readings always retained.`);
      document.getElementById('temp-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);c.temp=Number(data.get('temp'));c.usual=Number(data.get('usual'));c.sensorType=data.get('sensorType');c.ambientSensitivity=Number(data.get('sensitivity'));c.readings.push({at:new Date().toISOString(),raw:c.temp,ambient:weather.current,apparent:weather.apparent,source:state.sensorOn?'sensor':'manual'});c.readings=c.readings.slice(-96);const next=temperatureAnalysis(c);c.notes.unshift({date:now(),title:'Climate-optimized temperature sample',detail:`Raw ${c.temp.toFixed(1)}°C; optimized ${next.optimized.toFixed(1)}°C; predicted normal ${next.predicted.toFixed(1)}°C; local weather ${Number.isFinite(weather.current)?weather.current.toFixed(1)+'°C':'unavailable'}.`,label:next.level==='stable'?'Normal':next.level==='monitor'?'Monitor':'Urgent'});save();toastMsg('Sensor sample optimized with local weather.');render()};
      document.getElementById('sensor-switch').onclick=()=>{state.sensorOn=!state.sensorOn;save();render()};
      document.getElementById('refresh-weather').onclick=()=>fetchWeather();
      document.getElementById('city-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;button.textContent='Searching…';try{const updated=await searchPlace(new FormData(e.target).get('city'));if(updated===false&&document.body.contains(button)){button.disabled=false;button.textContent='Use place'}}catch(error){toastMsg(error.message);button.disabled=false;button.textContent='Use place'}};
      document.getElementById('use-location').onclick=()=>{const button=document.getElementById('use-location');if(!navigator.geolocation){toastMsg('Location is not available in this browser.');return}button.disabled=true;button.textContent='Finding location…';navigator.geolocation.getCurrentPosition(async position=>{await fetchWeather(position.coords.latitude,position.coords.longitude,'Current farm location');if(document.body.contains(button)){button.disabled=false;button.textContent='◎ Use current location'}},()=>{button.disabled=false;button.textContent='◎ Use current location';toastMsg('Location permission was not available. Search for the place instead.')},{timeout:8000,maximumAge:600000})};
      if(!weather.updated&&weather.status==='idle')setTimeout(()=>fetchWeather(),0);
    }
    function diet(){const c=animal();frame(`<div class="two-col"><section class="card wide-card"><div class="head"><h2>Diet plan</h2><button class="button primary" data-action="add-diet">+ Add diet item</button></div><div class="edit-list">${c.diet.map((d,i)=>`<div class="edit-row"><div><b>${esc(d[0])} — ${esc(d[1])}</b><small>${esc(d[2])}</small></div><button class="delete" data-remove-diet="${i}">Remove</button></div>`).join('')}</div></section><aside class="card info"><div class="head"><h2>Medication</h2><button class="link" data-action="add-med">+ Add</button></div><div class="edit-list">${c.meds.map((m,i)=>`<div class="edit-row"><div><b>${esc(m.name)}</b><small>${esc(m.detail)} · ${esc(m.due)}</small></div><button class="delete" data-remove-med="${i}">Remove</button></div>`).join('')}</div><p class="small-note">Only record medication prescribed or approved by a qualified veterinarian.</p></aside></div>`,'Diet & medication',`Manage ${c.name}’s daily feed plan and treatment reminders.`);document.querySelector('[data-action="add-diet"]').onclick=addDiet;document.querySelector('[data-action="add-med"]').onclick=addMed;document.querySelectorAll('[data-remove-diet]').forEach(b=>b.onclick=()=>{c.diet.splice(Number(b.dataset.removeDiet),1);save();render()});document.querySelectorAll('[data-remove-med]').forEach(b=>b.onclick=()=>{c.meds.splice(Number(b.dataset.removeMed),1);save();render()})}

    function openModal(title,copy,fields,submit){document.getElementById('modal-title').textContent=title;document.getElementById('modal-copy').textContent=copy;const form=document.getElementById('modal-form');form.innerHTML=fields+`<div class="modal-actions"><button class="button ghost" type="button" id="close-modal">Cancel</button><button class="button primary" type="submit">Save</button></div>`;modal.classList.add('open');document.getElementById('close-modal').onclick=closeModal;form.onsubmit=e=>{e.preventDefault();submit(new FormData(form));closeModal()}}

    const careLanguage=()=>localStorage.getItem('herdcare-language-v1')||'en';const careCopy={en:{title:'Care review',intro:'AI-supported safety triage — not a diagnosis or prescription.',observed:'What was recorded',areas:'Potential concern areas — not diagnoses',next:'Recommended next step',medicine:'Medication safety',outlook:'What this review cannot determine',urgent:'Urgent: contact a qualified veterinarian now.',prompt:'Contact a qualified veterinarian today or as soon as possible.',monitor:'Continue close monitoring and contact a veterinarian if signs persist, worsen, or new signs appear.',medication:'Do not start, stop, or change any medication or dose from this review. Use only a veterinarian-approved plan and observe any milk or meat withdrawal instructions.',prognosis:'A note or photo cannot determine the disease, curability, or prognosis. A veterinarian needs the animal’s history and an in-person examination.',photo:'A photo was saved for the animal record. Images can document visible changes, but they cannot safely confirm a disease.',done:'Done',breathing:'Breathing or respiratory signs',appetite:'Appetite or water-intake changes',eye:'Eye, skin, discharge, or wound signs',digestive:'Digestive signs',mobility:'Mobility, swelling, or injury signs',general:'General health change'},hi:{title:'देखभाल समीक्षा',intro:'AI-सहायता प्राप्त सुरक्षा समीक्षा — निदान या दवा सलाह नहीं।',observed:'क्या दर्ज किया गया',areas:'संभावित चिंता क्षेत्र — निदान नहीं',next:'सुझाया गया अगला कदम',medicine:'दवा सुरक्षा',outlook:'यह समीक्षा क्या निर्धारित नहीं कर सकती',urgent:'तुरंत: अभी योग्य पशु चिकित्सक से संपर्क करें।',prompt:'आज या जल्द से जल्द योग्य पशु चिकित्सक से संपर्क करें।',monitor:'करीबी निगरानी जारी रखें और लक्षण बने रहने, बिगड़ने या नए लक्षण आने पर पशु चिकित्सक से संपर्क करें।',medication:'इस समीक्षा के आधार पर कोई दवा या खुराक शुरू, बंद या न बदलें। केवल पशु चिकित्सक द्वारा स्वीकृत योजना का उपयोग करें और दूध/मांस वापसी निर्देशों का पालन करें।',prognosis:'एक नोट या फोटो बीमारी, इलाज की संभावना या परिणाम निर्धारित नहीं कर सकता। पशु चिकित्सक को इतिहास और प्रत्यक्ष जांच की जरूरत होती है।',photo:'पशु रिकॉर्ड में फोटो सहेजा गया है। तस्वीरें दिखाई देने वाले बदलाव दर्ज कर सकती हैं, लेकिन बीमारी की सुरक्षित पुष्टि नहीं कर सकतीं।',done:'हो गया',breathing:'साँस या श्वसन संबंधी संकेत',appetite:'भूख या पानी पीने में बदलाव',eye:'आँख, त्वचा, स्राव या घाव के संकेत',digestive:'पाचन संबंधी संकेत',mobility:'चलने, सूजन या चोट के संकेत',general:'सामान्य स्वास्थ्य बदलाव'},bn:{title:'পরিচর্যা পর্যালোচনা',intro:'AI-সহায়তাপ্রাপ্ত নিরাপত্তা মূল্যায়ন — রোগ নির্ণয় বা প্রেসক্রিপশন নয়।',observed:'কী নথিভুক্ত হয়েছে',areas:'সম্ভাব্য উদ্বেগের ক্ষেত্র — রোগ নির্ণয় নয়',next:'প্রস্তাবিত পরবর্তী পদক্ষেপ',medicine:'ওষুধের নিরাপত্তা',outlook:'এই পর্যালোচনা কী নির্ধারণ করতে পারে না',urgent:'জরুরি: এখনই যোগ্য পশু চিকিৎসকের সাথে যোগাযোগ করুন।',prompt:'আজ অথবা যত দ্রুত সম্ভব যোগ্য পশু চিকিৎসকের সাথে যোগাযোগ করুন।',monitor:'নিবিড় পর্যবেক্ষণ চালিয়ে যান; লক্ষণ স্থায়ী হলে, খারাপ হলে বা নতুন লক্ষণ দেখা দিলে চিকিৎসকের সাথে যোগাযোগ করুন।',medication:'এই পর্যালোচনার ভিত্তিতে কোনো ওষুধ বা মাত্রা শুরু, বন্ধ বা পরিবর্তন করবেন না। কেবল পশু চিকিৎসকের অনুমোদিত পরিকল্পনা ব্যবহার করুন এবং দুধ/মাংস প্রত্যাহারের নির্দেশ মানুন।',prognosis:'একটি নোট বা ছবি রোগ, নিরাময়যোগ্যতা বা ফলাফল নির্ধারণ করতে পারে না। পশু চিকিৎসকের ইতিহাস ও সরাসরি পরীক্ষা দরকার।',photo:'প্রাণীর রেকর্ডে ছবি সংরক্ষণ করা হয়েছে। ছবি দৃশ্যমান পরিবর্তন নথিভুক্ত করতে পারে, কিন্তু রোগ নিরাপদে নিশ্চিত করতে পারে না।',done:'সম্পন্ন',breathing:'শ্বাস বা শ্বাসযন্ত্রের লক্ষণ',appetite:'ক্ষুধা বা পানি গ্রহণের পরিবর্তন',eye:'চোখ, ত্বক, স্রাব বা ক্ষতের লক্ষণ',digestive:'হজমের লক্ষণ',mobility:'চলাচল, ফোলা বা আঘাতের লক্ষণ',general:'সাধারণ স্বাস্থ্য পরিবর্তন'},mr:{title:'काळजी आढावा',intro:'AI-सहाय्यित सुरक्षा तपासणी — निदान किंवा औषध सूचना नाहीत।',observed:'काय नोंदवले आहे',areas:'संभाव्य चिंतेची क्षेत्रे — निदान नाही',next:'सुचवलेले पुढील पाऊल',medicine:'औषध सुरक्षितता',outlook:'हा आढावा काय ठरवू शकत नाही',urgent:'तातडीचे: आत्ताच पात्र पशुवैद्याशी संपर्क करा।',prompt:'आज किंवा शक्य तितक्या लवकर पात्र पशुवैद्याशी संपर्क करा।',monitor:'काळजीपूर्वक निरीक्षण सुरू ठेवा; लक्षणे टिकल्यास, वाढल्यास किंवा नवीन लक्षणे आल्यास पशुवैद्याशी संपर्क करा।',medication:'या आढाव्याच्या आधारे औषध किंवा मात्रा सुरू, बंद किंवा बदलू नका। फक्त पशुवैद्याने मान्य केलेली योजना वापरा आणि दूध/मांस वापसी सूचना पाळा।',prognosis:'एक नोंद किंवा फोटो आजार, बरा होण्याची शक्यता किंवा परिणाम ठरवू शकत नाही। पशुवैद्याला इतिहास आणि प्रत्यक्ष तपासणी आवश्यक असते।',photo:'जनावराच्या नोंदीत फोटो जतन केला आहे। फोटो दृश्यमान बदल नोंदवू शकतात, पण आजाराची सुरक्षितपणे पुष्टी करू शकत नाहीत।',done:'पूर्ण',breathing:'श्वास किंवा श्वसनाची लक्षणे',appetite:'भूक किंवा पाणी पिण्यात बदल',eye:'डोळे, त्वचा, स्त्राव किंवा जखमेची लक्षणे',digestive:'पचनाची लक्षणे',mobility:'हालचाल, सूज किंवा दुखापतीची लक्षणे',general:'सामान्य आरोग्यात बदल'}};const careText=()=>careCopy[careLanguage()]||careCopy.en;
    function reviewObservation(detail,temp,photo){const c=careText(),q=String(detail||'').toLowerCase(),concerns=[];if(/cough|breath|wheez|nasal|respirat|सांस|श्वास|কাশি|শ্বাস/.test(q))concerns.push(c.breathing);if(/eat|appetite|water|drink|feed|भूख|पानी|चारा|ক্ষুধা|পানি|খাদ্য/.test(q))concerns.push(c.appetite);if(/eye|skin|discharge|wound|injur|आँख|आंख|त्वचा|घाव|চোখ|ত্বক|ক্ষত/.test(q))concerns.push(c.eye);if(/diarr|manure|stool|bloat|digest|दस्त|गोबर|पाचन|ডায়র|হজম/.test(q))concerns.push(c.digestive);if(/limp|lameness|swelling|leg|walk|लंगड़|सूजन|चलने|খোঁড়|ফোলা/.test(q))concerns.push(c.mobility);if(!concerns.length)concerns.push(c.general);const urgent=/collapse|unconscious|severe bleed|heavy bleed|cannot stand|not drink|difficult calv|collapse|बेहोश|गिर|बहुत खून|कठिन प्रसव|অজ্ঞান|পড়ে|রক্তপাত|কঠিন প্রসব/.test(q)||Number(temp)>=40;const prompt=!urgent&&(/fever|temperature|eye|discharge|swelling|limp|diarr|wound|off feed|appetite|बुखार|तापमान|आँख|सूजन|दस्त|ज्वर|জ্বর|তাপমাত্রা|চোখ|ফোলা|ডায়র/.test(q)||Number(temp)>39.3);return{level:urgent?'urgent':prompt?'prompt':'monitor',concerns,photo,detail:detail||'',copy:c}}
    function showCareReview(review){const c=review.copy,color=review.level==='urgent'?'#b74440':review.level==='prompt'?'#b87017':'#216b46',action=c[review.level];const recorded=review.detail?esc(review.detail):c.photo;openModal(c.title,c.intro,`<div style="display:grid;gap:12px;font-size:12px"><div style="padding:11px;border-left:4px solid ${color};border-radius:8px;background:#f6faf6"><strong>${esc(c.next)}</strong><br>${esc(action)}</div><div><strong>${esc(c.observed)}</strong><p style="margin:4px 0 0;color:#68766c">${recorded}</p></div><div><strong>${esc(c.areas)}</strong><p style="margin:4px 0 0;color:#68766c">${review.concerns.map(esc).join(' · ')}</p></div><div style="padding:11px;border-left:4px solid #b87017;border-radius:8px;background:#fff4df"><strong>${esc(c.medicine)}</strong><br>${esc(c.medication)}</div><div style="padding:11px;border-left:4px solid #216b46;border-radius:8px;background:#eff8ef"><strong>${esc(c.outlook)}</strong><br>${esc(c.prognosis)}</div></div>`,()=>{});document.querySelector('#modal-form .button.primary').textContent=c.done}
    function addNote(){openModal('Add health record','Save an observation, symptom or treatment note to this animal’s history.',`<label>Entry type<select name="type"><option>General observation</option><option>Appetite and activity</option><option>Veterinary visit</option><option>Medication update</option></select></label><label>Details<textarea name="detail" placeholder="Example: Appetite lower than usual this afternoon." required></textarea></label><label>Temperature (optional, °C)<input name="temp" type="number" min="35" max="45" step="0.1" placeholder="39.6"></label>`,d=>{const c=animal(),t=d.get('temp'),detail=d.get('detail');if(t)c.temp=Number(t);c.notes.unshift({date:now(),title:d.get('type'),detail,label:t&&Number(t)>39.3?'Monitor':'Saved'});const review=reviewObservation(detail,t||c.temp,false);c.lastCareReview={at:now(),level:review.level,concerns:review.concerns};save();render();toastMsg('Health record saved.');showCareReview(review)})}
    function addPhoto(){const c=animal();openModal('Add photo health check','Choose a clear photo. It is saved only in this browser for this prototype.',`<label>Photo<input type="file" name="photo" accept="image/*" required></label><label>Optional note<textarea name="detail" placeholder="Example: Checked eyes and coat after morning feeding."></textarea></label>`,d=>{const file=d.get('photo');if(!file||!file.size)return;const r=new FileReader();r.onload=()=>{const detail=d.get('detail');c.photo=r.result;c.notes.unshift({date:now(),title:'Photo health check added',detail:detail||'Photo added to the local health record. A veterinary review can be requested for visible changes.',label:'Photo'});const review=reviewObservation(detail,c.temp,true);c.lastCareReview={at:now(),level:review.level,concerns:review.concerns};save();render();toastMsg('Photo saved to the health record.');showCareReview(review)};r.readAsDataURL(file)})}
    function personalizeAnimalPhoto(id){const c=state.cattle.find(item=>item.id===id);if(!c)return;openModal('Personalize animal photo','Add a profile photo for this animal. It is stored only in this browser for the prototype.',`<label>Photo<input type="file" name="photo" accept="image/*" required></label>`,d=>{const file=d.get('photo');if(!file||!file.size)return;const r=new FileReader();r.onload=()=>{c.photo=r.result;save();render();toastMsg(`${c.name}’s profile photo was updated.`)};r.readAsDataURL(file)})}
    const createAnimalRecord=({id,name,species,breed,age,group})=>{const meta=speciesMeta(species),pet=species==='Dog'||species==='Cat';return{id,name,type:species,species,breed:breed||'Not recorded',age:age||'Not recorded',weight:'Not recorded',group:group||meta.group,temp:meta.normal,usual:meta.normal,photo:'',notes:[],diet:pet?[['Daily meals','Not set','Add a feeding plan'],['Water','Always available','Fresh water']]:[['Daily feed','Not set','Add a feed plan'],['Water target','Not set','Fresh water']],meds:[]}};
    function addCattle(){openModal('Add animal profile','Create a record for a pet or farm animal.',`<label>Animal type<select name="species">${Object.keys(speciesCatalog).map(value=>`<option value="${value}">${speciesMeta(value).emoji} ${value}</option>`).join('')}</select></label><label>Name<input name="name" required placeholder="e.g. Bruno, Gauri or Tara"></label><label>ID / tag<input name="id" required placeholder="e.g. HOME-DOG-01 or SHED-A-104"></label><label>Breed<input name="breed" placeholder="e.g. Indie, Murrah or Jamunapari"></label><label>Age<input name="age" placeholder="e.g. 3 years"></label><label>Home / group / pen<input name="group" placeholder="e.g. Home pets, Shed A or Goat group"></label>`,d=>{const id=d.get('id').trim(),species=d.get('species');if(state.cattle.some(c=>c.id===id)){toastMsg('That animal ID already exists.');return}state.cattle.push(createAnimalRecord({id,name:d.get('name').trim(),species,breed:d.get('breed').trim(),age:d.get('age').trim(),group:d.get('group').trim()}));normalizeState();state.selected=id;save();goPage('overview');toastMsg('New animal profile created.')})}
    function addAnimalGroup(){openModal('Add a group in bulk','Useful for onboarding a pen, shed or herd. You can edit each profile later.',`<label>Animal type<select name="species">${Object.keys(speciesCatalog).map(value=>`<option value="${value}">${speciesMeta(value).emoji} ${value}</option>`).join('')}</select></label><label>Number of animals<input name="count" type="number" min="2" max="1000" value="25" required></label><label>Group / pen name<input name="group" required placeholder="e.g. Shed A, Buffalo group or Home foster"></label><label>ID prefix<input name="prefix" required placeholder="e.g. SHED-A"></label><label>Breed (optional)<input name="breed" placeholder="e.g. Sahiwal"></label>`,d=>{const species=d.get('species'),count=clamp(Number(d.get('count'))||2,2,1000),group=d.get('group').trim(),breed=d.get('breed').trim(),prefix=(d.get('prefix').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'-')||'ANIMAL').replace(/-+/g,'-');let created=0,index=1,firstId='';while(created<count){const id=`${prefix}-${String(index++).padStart(3,'0')}`;if(state.cattle.some(c=>c.id===id))continue;const name=`${species} ${String(created+1).padStart(3,'0')}`;state.cattle.push(createAnimalRecord({id,name,species,breed,age:'Not recorded',group}));if(!firstId)firstId=id;created++}normalizeState();state.selected=firstId||state.selected;state.animalView=count>=20?'list':state.animalView;if(count>=100)state.workspace.mode='farm';save();cattle();toastMsg(`${created.toLocaleString()} animal profiles added to ${group}.`)})}
    function addDiet(){openModal('Add diet item','Add a feed, water, or supplement target.',`<label>Item name<input name="name" required placeholder="e.g. Evening feed"></label><label>Amount<input name="amount" required placeholder="e.g. 12 kg"></label><label>Description<input name="detail" required placeholder="e.g. Dry fodder"></label>`,d=>{animal().diet.push([d.get('name'),d.get('amount'),d.get('detail')]);save();render();toastMsg('Diet item added.')})}
    function addMed(){openModal('Add medication reminder','Keep dosage and scheduling details in the health record.',`<label>Medicine name<input name="name" required></label><label>Dosage / instruction<input name="detail" required placeholder="e.g. 60 g with evening feed"></label><label>Due date or timing<input name="due" required placeholder="e.g. Today"></label>`,d=>{animal().meds.push({name:d.get('name'),detail:d.get('detail'),due:d.get('due')});save();render();toastMsg('Medication reminder added.')})}
    function addVet(){openModal('Add local veterinarian','Save a verified local contact for this prototype.',`<label>Veterinarian name<input name="name" required></label><label>Clinic<input name="clinic" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Clinic address<input name="address" required></label><label>Distance (optional)<input name="distance" placeholder="e.g. 2.5 km"></label>`,d=>{state.vets.push({name:d.get('name'),clinic:d.get('clinic'),address:d.get('address'),phone:d.get('phone'),distance:d.get('distance')||'Local',open:'Hours not recorded',emoji:'👩🏽‍⚕️',emergency:false});save();render();toastMsg('Veterinarian contact added.')})}
    let toastTimer;function toastMsg(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2800)}
    window.HerdCareTemperature={
      ingest({animalId=state.selected,temp,timestamp=new Date().toISOString(),source='gateway'}={}){const c=state.cattle.find(item=>item.id===animalId);const raw=Number(temp);if(!c||!Number.isFinite(raw)||raw<35||raw>45)throw new Error('A valid animalId and temperature from 35–45°C are required.');c.temp=raw;c.readings.push({at:timestamp,raw,ambient:state.weather.current,apparent:state.weather.apparent,source});c.readings=c.readings.slice(-96);save();if(c.id===state.selected)render();return temperatureAnalysis(c)},
      refreshWeather(){return fetchWeather()},
      analyze(animalId=state.selected){const c=state.cattle.find(item=>item.id===animalId);return c?temperatureAnalysis(c):null}
    };
    window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(PAGES.includes(next)&&next!==page){page=next;render()}});
    render();
  })();
  </script>
  <script>
    /* GPS tracker and geofence prototype. A hardware gateway can call HerdCareGPS.ingest(). */
    (()=>{
      const GPS_KEY='herdcare-gps-geofence-v1';
      const defaults={animalId:'GV-042',radius:250,current:{x:60,y:46},previous:{x:53,y:49},updated:'Just now',connected:true,wasOutside:false};
      let gps;try{gps={...defaults,...JSON.parse(localStorage.getItem(GPS_KEY))}}catch{gps={...defaults}};
      const persist=()=>localStorage.setItem(GPS_KEY,JSON.stringify(gps));
      const herd=()=>{try{return JSON.parse(localStorage.getItem('herdcare-working-prototype-v1'))?.cattle||[{id:'GV-042',name:'Bella'}]}catch{return[{id:'GV-042',name:'Bella'}]}};
      const tracked=()=>herd().find(a=>a.id===gps.animalId)||herd()[0]||{id:'GV-042',name:'Bella'};
      const trackerIcon=animal=>({Dog:'🐕',Cat:'🐈',Cow:'🐄',Buffalo:'🐃',Goat:'🐐',Sheep:'🐑'}[animal.species]||'🐾');
      const distance=()=>Math.round(Math.hypot(gps.current.x-50,gps.current.y-50)*10);
      const outside=()=>distance()>gps.radius;
      const toast=message=>{const box=document.getElementById('toast');if(!box)return;box.textContent=message;box.classList.add('show');clearTimeout(window.herdcareGpsToast);window.herdcareGpsToast=setTimeout(()=>box.classList.remove('show'),5000)};
      const checkGeofence=()=>{const escaped=outside();if(escaped&&!gps.wasOutside)toast(`⚠ GPS alert: ${tracked().name} has left the ${gps.radius} m care boundary.`);if(!escaped&&gps.wasOutside)toast(`✓ GPS update: ${tracked().name} is back inside the care boundary.`);gps.wasOutside=escaped;persist()};
      const styles=document.createElement('style');styles.textContent=`
        .gps-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(285px,.75fr);gap:20px}.gps-map-card{padding:19px}.gps-map{height:390px;position:relative;overflow:hidden;border:1px solid #c9ddcb;border-radius:12px;background:linear-gradient(135deg,#deeed8 0 22%,#c4dfb6 22% 24%,#e7efd7 24% 48%,#cbe3cc 48% 51%,#e5f0e2 51%);isolation:isolate}.gps-map:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(35deg,transparent 0 54px,#ffffff8a 55px 61px,transparent 62px 112px);opacity:.8}.gps-map:after{content:'N';position:absolute;z-index:4;right:15px;top:12px;width:25px;height:25px;border-radius:50%;background:#fff;color:var(--forest);display:grid;place-items:center;font-size:11px;font-weight:900;box-shadow:0 2px 7px #173d2a22}.farm-boundary{position:absolute;z-index:1;left:50%;top:50%;translate:-50% -50%;width:var(--boundary);aspect-ratio:1;border:3px dashed var(--green);border-radius:50%;background:#b7df7530;box-shadow:0 0 0 5px #ffffff4f}.farm-label{position:absolute;z-index:2;left:50%;top:50%;translate:-50% -50%;padding:5px 9px;border-radius:99px;background:#fff;color:var(--forest);font-size:10px;font-weight:850;white-space:nowrap;box-shadow:0 2px 7px #173d2a18}.gps-route{position:absolute;z-index:2;inset:0;width:100%;height:100%;overflow:visible}.gps-route path{stroke:#b87017;stroke-width:3;stroke-dasharray:7 5;fill:none;marker-end:url(#route-arrow)}.gps-marker{position:absolute;z-index:3;left:var(--animal-x);top:var(--animal-y);translate:-50% -50%;width:37px;height:37px;border:3px solid #fff;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 4px 12px #7f282855}.gps-marker.safe{background:var(--green)}.gps-marker:after{content:'';position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid currentColor;opacity:.32;animation:gps-pulse 1.8s infinite}.gps-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--muted)}.gps-legend span:before{content:'';display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;background:var(--green)}.gps-legend span:nth-child(2):before{background:var(--red)}.gps-legend span:nth-child(3):before{background:#b87017}@keyframes gps-pulse{0%,100%{scale:.65;opacity:.42}50%{scale:1;opacity:0}}.gps-metric{display:grid;gap:4px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.gps-metric b{font-size:21px;letter-spacing:-.6px}.gps-metric small{color:var(--muted);font-size:10px}.gps-alert{border-left:4px solid var(--red);background:var(--red-bg);padding:12px;border-radius:9px;color:#7b2c28;font-size:12px}.gps-safe{border-left:4px solid var(--green);background:var(--pale);padding:12px;border-radius:9px;color:var(--forest);font-size:12px}.gps-controls{display:grid;gap:12px}.gps-controls input[type=range]{width:100%;accent-color:var(--green)}.gps-buttons{display:flex;gap:8px;flex-wrap:wrap}.gps-buttons .button{font-size:12px;padding:8px 10px}.gps-route-note{margin:0;color:var(--muted);font-size:12px}@media(max-width:800px){.gps-layout{grid-template-columns:1fr}.gps-map{height:320px}}
      `;document.head.append(styles);
      const addNav=()=>{const nav=document.querySelector('.nav');if(!nav||nav.querySelector('[data-gps-page]'))return;const button=document.createElement('button');button.dataset.gpsPage='true';button.innerHTML='<span>◉</span>GPS tracker';button.onclick=showGps;nav.append(button)};
      const mapHtml=()=>{const animal=tracked(),isOut=outside(),size=Math.max(28,Math.min(84,gps.radius/6));return `<div class="gps-map" style="--boundary:${size}%;--animal-x:${gps.current.x}%;--animal-y:${gps.current.y}%"><div class="farm-boundary"></div><div class="farm-label">Safe care area · ${gps.radius} m</div><svg class="gps-route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Recent route"><defs><marker id="route-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b87017"/></marker></defs><path d="M${gps.previous.x},${gps.previous.y} L${(gps.previous.x+gps.current.x)/2},${(gps.previous.y+gps.current.y)/2} L${gps.current.x},${gps.current.y}"/></svg><div class="gps-marker ${isOut?'':'safe'}" title="${animal.name}'s current GPS location">${trackerIcon(animal)}</div></div>`};
      function showGps(){
        const main=document.querySelector('#app main');if(!main)return;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',!!b.dataset.gpsPage));
        const animal=tracked(),isOut=outside(),metres=distance(),animals=herd();
        main.innerHTML=`<header class="top"><div><div class="eyebrow">Live location & safety</div><h1>GPS tracker</h1><p>Track a pet or farm animal inside a designated safe boundary.</p></div><div class="tools"><span class="mini">${gps.connected?'● TRACKER CONNECTED':'○ TRACKER OFFLINE'}</span></div></header><div class="gps-layout"><section class="card gps-map-card"><div class="head"><h2>${animal.name}'s current route</h2><span class="mini">Updated ${gps.updated}</span></div>${mapHtml()}<div class="gps-legend"><span>Care boundary</span><span>${isOut?'Outside boundary':'Current location'}</span><span>Recent travel direction</span></div></section><aside class="stack"><section class="card section"><div class="head"><h2>Geofence status</h2><span class="mini" style="${isOut?'background:#fff0ef;color:#b74440':''}">${isOut?'ALERT':'SAFE'}</span></div><div class="${isOut?'gps-alert':'gps-safe'}"><strong>${isOut?`${animal.name} has left the safe boundary.`:`${animal.name} is within the designated care area.`}</strong><br>${isOut?`${metres} m from the centre — ${metres-gps.radius} m past the boundary.`:`${metres} m from the centre.`}</div><div class="gps-controls" style="margin-top:15px"><label class="form">Tracked animal<select id="gps-animal">${animals.map(a=>`<option value="${a.id}" ${a.id===animal.id?'selected':''}>${trackerIcon(a)} ${a.name} · ${a.id}</option>`).join('')}</select></label><label class="form">Care boundary radius: <b id="radius-value">${gps.radius} m</b><input id="gps-radius" type="range" min="100" max="500" step="25" value="${gps.radius}"></label></div></section><section class="card section"><div class="head"><h2>Movement insight</h2></div><p class="gps-route-note"><strong>${isOut?'Moving outside the configured safe area.':'Moving within the configured safe area.'}</strong><br>Route arrow shows the last two tracker pings. An alert is generated when the tracker crosses the care boundary.</p><div class="gps-buttons" style="margin-top:14px"><button class="button primary" id="gps-exit">Simulate boundary exit</button><button class="button ghost" id="gps-return">Return inside</button></div></section></aside></div><p class="footer">GPS positions are shown from the animal’s attached tracker. In production, use a secure tracker gateway and verified home or farm coordinates.</p>`;
        document.getElementById('gps-animal').onchange=e=>{gps.animalId=e.target.value;persist();showGps()};
        document.getElementById('gps-radius').oninput=e=>{gps.radius=Number(e.target.value);document.getElementById('radius-value').textContent=`${gps.radius} m`;checkGeofence();showGps()};
        document.getElementById('gps-exit').onclick=()=>ingest({x:84,y:30,updated:'Just now'});
        document.getElementById('gps-return').onclick=()=>ingest({x:60,y:46,updated:'Just now'});
      }
      function ingest(update){gps.previous={...gps.current};gps.current={x:Number(update.x),y:Number(update.y)};gps.updated=update.updated||new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});checkGeofence();if(document.querySelector('[data-gps-page].active'))showGps()}
      window.HerdCareGPS={ingest};
      new MutationObserver(addNav).observe(document.getElementById('app'),{childList:true,subtree:true});addNav();checkGeofence();
    })();

      let config={model:'gemini-2.5-flash',endpoint:'',apiKey:''};

{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:#fff}.aashu-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:12px}.aashu-send{border:0;border-radius:9px;background:var(--green);color:#fff;padding:0 12px;font-weight:800;cursor:pointer}@media(max-width:540px){.aashu-fab{bottom:15px;left:15px}.aashu-chat{left:15px;bottom:82px}}

      const fab=document.createElement('button');fab.className='aashu-fab';fab.title='Ask Aashu';fab.setAttribute('aria-label','Open Aashu animal-care assistant');fab.textContent='✦';document.body.append(shell,fab);

        if(config.apiKey){const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(config.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':config.apiKey},body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM()}]},contents})});if(!response.ok)throw new Error('Gemini request unavailable');const data=await response.json();return data.candidates?.[0]?.content?.parts?.map(part=>part.text||'').join('')||text('offline')}

      const renderResults=()=>{const query=document.getElementById('animal-search')?.value.toLowerCase().trim()||'';const category=document.getElementById('animal-category')?.value||'All';const found=profiles.filter(item=>(category==='All'||item.animal===category)&&`${item.animal} ${item.breed} ${item.type} ${item.about}`.toLowerCase().includes(query));const grid=document.getElementById('breed-results');if(!grid)return;grid.innerHTML=found.length?found.map(card).join(''):`<div class="card library-empty">No built-in profile found. Try the open-knowledge search below.</div>`;grid.querySelectorAll('[data-ask-breed]').forEach(button=>button.onclick=()=>window.HerdCareAashu?.ask(`What should I monitor for a ${button.dataset.askBreed}? Please include diet, behaviour, and preventive-care questions to discuss with a veterinarian.`))};
      const searchOpenKnowledge=async()=>{const query=document.getElementById('animal-search').value.trim();const box=document.getElementById('open-knowledge');if(!query){box.innerHTML='<p class="library-footer-note">Type an animal or breed name to search the open-knowledge database.</p>';return}box.innerHTML='<p class="library-footer-note">Searching the open-knowledge database…</p>';try{const search=await fetch(`https://en.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(query)}&limit=1`);const data=await search.json();const result=data.pages?.[0];if(!result)throw new Error('No result');const title=result.title.replace(/ /g,'_');const summaryResponse=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);const summary=await summaryResponse.json();box.innerHTML=`<article class="card open-result"><span class="breed-kind">Open knowledge result</span><h2>${safe(summary.title||result.title)}</h2><p>${safe(summary.extract||result.description||'No summary available.')}</p><a class="link" target="_blank" rel="noopener" href="${safe(summary.content_urls?.desktop?.page||'https://en.wikipedia.org/wiki/'+encodeURIComponent(title))}">Read the source article ↗</a></article>`}catch{box.innerHTML='<p class="library-footer-note">The online source could not be reached. The built-in breed profiles remain available offline.</p>'}};
      function showLibrary(){const main=document.querySelector('#app main');if(!main)return;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',!!button.dataset.libraryPage));main.innerHTML=`<header class="top"><div><div class="eyebrow">Open animal knowledge</div><h1>Animal & breed library</h1><p>Search practical starter profiles for cattle, dogs, goats, and their breeds.</p></div></header><div class="library-intro"><span style="font-size:19px">◌</span><div><b>Breed profiles for everyday reference</b>Diet and lifespan guidance is general education. Individual feeding, medication, vaccination, and health decisions should be confirmed with a qualified veterinarian or animal nutritionist.</div></div><div class="library-tools"><div class="library-search"><input id="animal-search" autocomplete="off" placeholder="Search an animal or breed — e.g. Sahiwal, dog, Golden Retriever"><button id="open-search">Search open knowledge</button></div><select id="animal-category" class="library-filter" aria-label="Animal category"><option>All</option><option>Cattle</option><option>Dog</option><option>Goat</option></select></div><section class="library-grid" id="breed-results"></section><section id="open-knowledge" class="open-knowledge"></section><p class="library-footer-note">Online lookups use Wikimedia’s open knowledge content. Review the linked source and consult local professionals for animal-specific care.</p>`;document.getElementById('animal-search').oninput=renderResults;document.getElementById('animal-category').onchange=renderResults;document.getElementById('open-search').onclick=searchOpenKnowledge;renderResults()}
      new MutationObserver(addNav).observe(document.getElementById('app'),{childList:true,subtree:true});addNav();

  <script>
    /* Vet Portal: local prototype database, registration, search, and directory enrichment. */
    (()=>{
      const VET_KEY='herdcare-vet-profiles-v1';

      const load=()=>{try{return JSON.parse(localStorage.getItem(VET_KEY))||[]}catch{return[]}};
      const save=profiles=>localStorage.setItem(VET_KEY,JSON.stringify(profiles));
      const baseDirectory=()=>{const starter=[{name:'Dr. Ananya Sharma',clinic:'Green Cross Veterinary Clinic',address:'12 Farm Road, Green Valley',phone:'+919800123456',open:'Open now'},{name:'Dr. Vikram Rao',clinic:'District Animal Hospital',address:'Market Road, Green Valley',phone:'+919800789012',open:'24-hour service'},{name:'Dr. Meera Patel',clinic:'Rural Livestock Care',address:'Highway 7, Green Valley',phone:'+919800456789',open:'Open until 20:00'}];try{return (JSON.parse(localStorage.getItem('herdcare-working-prototype-v1'))?.vets||starter).map(v=>({id:`base-${v.phone}`,name:v.name,clinic:v.clinic,address:v.address,phone:v.phone,specialty:'Livestock & general veterinary care',availability:v.open,registration:'Directory listing',verified:true}))}catch{return starter.map(v=>({id:`base-${v.phone}`,...v,specialty:'Livestock & general veterinary care',availability:v.open,registration:'Directory listing',verified:true}))}};

      const style=document.createElement('style');style.textContent=`
        .vet-portal{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.35fr);gap:20px}.vet-registration{padding:19px}.vet-registration h2{margin:0 0 4px;font-size:17px}.vet-registration>p{margin:0 0 15px;color:var(--muted);font-size:12px}.vet-register-form{display:grid;gap:10px}.vet-register-form label{font-size:11px;font-weight:800}.vet-register-form input,.vet-register-form textarea,.vet-register-form select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.vet-register-form textarea{min-height:62px;resize:vertical}.vet-db-note{margin-top:13px;padding:10px;border-left:3px solid var(--amber);border-radius:7px;background:var(--amber-bg);color:#70460d;font-size:10px}.vet-directory-panel{display:grid;gap:11px}.vet-directory-tools{display:flex;gap:9px}.vet-directory-tools input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:12px}.vet-profile-card{padding:15px;display:grid;grid-template-columns:43px 1fr auto;gap:10px;align-items:start}.vet-profile-card h2{margin:0;font-size:14px}.vet-profile-card p{margin:3px 0;color:var(--muted);font-size:11px}.vet-profile-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#d6ebd8;font-size:21px}.vet-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.vet-badge{padding:3px 6px;border-radius:99px;background:var(--pale);color:var(--green);font-size:9px;font-weight:850}.vet-badge.pending{background:var(--amber-bg);color:var(--amber)}.vet-profile-actions{display:flex;gap:5px}.vet-profile-actions a{display:grid;place-items:center;width:29px;height:29px;border-radius:7px;background:#eaf4eb;color:var(--green);font-size:13px;text-decoration:none}.vet-empty{padding:21px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:850px){.vet-portal{grid-template-columns:1fr}.vet-profile-card{grid-template-columns:43px 1fr}.vet-profile-actions{grid-column:2}}
      `;document.head.append(style);
      const profileCard=profile=>`<article class="card vet-profile-card"><div class="vet-profile-avatar">⚕</div><div><h2>${safe(profile.name)}</h2><p><strong>${safe(profile.clinic)}</strong> · ${safe(profile.specialty)}</p><p>${safe(profile.address)} · ${safe(profile.availability)}</p><div class="vet-badges"><span class="vet-badge ${profile.verified?'':'pending'}">${profile.verified?'Verified directory listing':'Profile pending verification'}</span><span class="vet-badge">Reg. ${safe(profile.registration)}</span></div></div><div class="vet-profile-actions"><a href="tel:${safe(profile.phone)}" title="Call ${safe(profile.name)}">☎</a><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(profile.address)}" title="Directions">↗</a></div></article>`;
      const renderDirectory=()=>{const list=document.getElementById('vet-profile-list');if(!list)return;const query=document.getElementById('vet-directory-search')?.value.toLowerCase().trim()||'';const results=directory().filter(profile=>`${profile.name} ${profile.clinic} ${profile.specialty} ${profile.address}`.toLowerCase().includes(query));list.innerHTML=results.length?results.map(profileCard).join(''):'<div class="card vet-empty">No veterinarian profiles match this search.</div>'};
      function showPortal(){const main=document.querySelector('#app main');if(!main)return;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',!!button.dataset.vetPortal));main.innerHTML=`<header class="top"><div><div class="eyebrow">Professional directory</div><h1>Vet Portal</h1><p>Register a professional profile so local animal owners can find and contact you.</p></div></header><div class="vet-portal"><section class="card vet-registration"><h2>Create your vet profile</h2><p>Share professional details, practice location, and availability.</p><form class="vet-register-form" id="vet-registration-form"><label>Full name<input name="name" required placeholder="e.g. Dr. Priya Shah"></label><label>Clinic or practice<input name="clinic" required placeholder="e.g. Valley Animal Care"></label><label>Veterinary registration number<input name="registration" required placeholder="e.g. VCI/State registration no."></label><label>Specialty<input name="specialty" required placeholder="e.g. Cattle health, surgery, poultry"></label><label>Phone number<input name="phone" type="tel" required placeholder="Contact number"></label><label>Practice address<textarea name="address" required placeholder="Clinic address"></textarea></label><label>Availability<select name="availability"><option>Open now — hours to be confirmed</option><option>Weekdays</option><option>24-hour emergency service</option><option>By appointment</option></select></label><button class="button primary" type="submit">Create vet profile</button></form><div class="vet-db-note"><strong>Prototype database:</strong> profiles are stored on this browser. A production launch should validate registration numbers and save profiles through a secure server before public verification.</div></section><section class="vet-directory-panel"><div class="head"><h2>Veterinarian directory</h2><span class="mini">${directory().length} profiles</span></div><div class="vet-directory-tools"><input id="vet-directory-search" autocomplete="off" placeholder="Search name, clinic, specialty, or area"></div><div id="vet-profile-list" class="directory"></div></section></div><p class="footer">Directory information is for contact and discovery. Confirm professional credentials and clinical availability before making care decisions.</p>`;document.getElementById('vet-directory-search').oninput=renderDirectory;document.getElementById('vet-registration-form').onsubmit=event=>{event.preventDefault();const data=new FormData(event.currentTarget);const profiles=load();profiles.unshift({id:`vet-${Date.now()}`,name:data.get('name').trim(),clinic:data.get('clinic').trim(),registration:data.get('registration').trim(),specialty:data.get('specialty').trim(),phone:data.get('phone').trim(),address:data.get('address').trim(),availability:data.get('availability'),verified:false});save(profiles);toast('Vet profile saved to this device and added to the directory.');showPortal()};renderDirectory()}
      const addNav=()=>{const nav=document.querySelector('.nav');if(!nav||nav.querySelector('[data-vet-portal]'))return;const button=document.createElement('button');button.dataset.vetPortal='true';button.innerHTML='<span>⚕</span>Vet Portal';button.onclick=showPortal;nav.append(button)};
      const enrichExistingDirectory=()=>{const list=document.querySelector('.directory');if(!list||list.id==='vet-profile-list'||list.dataset.profileEnriched)return;const newProfiles=load();if(!newProfiles.length)return;list.dataset.profileEnriched='true';newProfiles.forEach(profile=>list.insertAdjacentHTML('beforeend',profileCard(profile)))};
      const update=()=>{addNav();enrichExistingDirectory()};new MutationObserver(update).observe(document.getElementById('app'),{childList:true,subtree:true});update();
    })();
