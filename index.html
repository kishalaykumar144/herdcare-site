  <script>
    /* Livestock product library: animal-husbandry outputs and waste-to-value guides. */
    (()=>{
      const products=[
        {id:'dairy',icon:'🥛',name:'Milk & dairy products',category:'Food',animals:'Dairy cattle · buffalo · goats',summary:'Turn clean, chilled milk into consumer-ready milk, curd, paneer, ghee, or cheese through hygienic, licensed processing.',steps:['Collect only clean milk from healthy animals and filter it using food-safe equipment.','Cool promptly and keep the cold chain intact until testing or processing.','Test and process through a licensed dairy facility; use validated pasteurisation and packaging controls.','Label, store, and distribute according to local food-safety rules.'],importance:'Value-added dairy products can reduce spoilage and diversify farm income.',considerations:'Food safety is critical. Follow local dairy licensing, hygiene, testing, and cold-chain requirements.'},
        {id:'eggs',icon:'🥚',name:'Table eggs',category:'Food',animals:'Laying hens · ducks · quail',summary:'Fresh eggs gathered, graded, packed, and sold using clean handling and appropriate storage.',steps:['Collect eggs frequently from clean nesting areas.','Remove visibly cracked or heavily soiled eggs from retail supply.','Grade and pack using clean, dry packaging.','Store and transport according to local egg-handling guidance.'],importance:'Egg production offers frequent, marketable outputs from well-managed poultry flocks.',considerations:'Keep housing clean and monitor flock health. Follow local rules for washing, labeling, and storage.'},
        {id:'wool',icon:'🧶',name:'Wool & fibre',category:'Materials',animals:'Sheep · fibre goats',summary:'Fleece is responsibly sheared, sorted, cleaned, and supplied to textile makers or local craft producers.',steps:['Plan shearing for suitable weather and animal comfort.','Use trained shearers and clean equipment to minimise stress and cuts.','Sort fleece by quality and remove contaminated material.','Store dry and send to an approved cleaning or processing partner.'],importance:'Fibre creates a renewable material stream and can add value beyond meat or milk.',considerations:'Animal welfare comes first. Keep animals protected from weather after shearing.'},
        {id:'compost',icon:'🌱',name:'Composted farm manure',category:'Farm input',animals:'Cattle · buffalo · goats · sheep · poultry',summary:'Manure and suitable bedding are composted into a stabilised soil amendment for fields and gardens.',steps:['Collect manure and bedding separately from plastics, medicines, and other contaminants.','Build managed compost piles with a balanced mix of moist nitrogen-rich and dry carbon-rich materials.','Turn and monitor piles using a locally appropriate compost plan.','Allow compost to mature fully before applying it to land.'],importance:'Composting returns nutrients and organic matter to soil while reducing unmanaged waste.',considerations:'Use protective equipment, manage runoff, and follow local nutrient-management rules. Do not apply unfinished compost to food crops.'},
        {id:'biogas',icon:'♨',name:'Biogas & digestate',category:'Energy',animals:'Cattle · buffalo · pigs · poultry',summary:'Organic manure can feed a purpose-built anaerobic digester that produces biogas and nutrient-rich digestate.',steps:['Have a qualified provider assess manure supply, water needs, site drainage, and local permissions.','Install an approved, sealed digester and gas-handling system.','Feed the system consistently with appropriate organic inputs and maintain it to specification.','Use biogas through approved equipment; handle digestate under a nutrient-management plan.'],importance:'A well-run system can convert waste into renewable energy and a useful fertiliser input.',considerations:'Gas systems present fire, asphyxiation, and pressure hazards. Use trained installers, ventilation, leak checks, and local regulatory approval.'},
        {id:'vermicompost',icon:'🪱',name:'Vermicompost',category:'Farm input',animals:'Cattle · goats · sheep · rabbits',summary:'Matured organic material is processed by compost worms into a fine, biologically active soil conditioner.',steps:['Pre-compost manure and bedding until it is cool and stabilised.','Prepare shaded beds with moisture and ventilation suitable for the worm species.','Add feedstock gradually and avoid chemicals, plastics, or fresh hot manure.','Harvest finished castings and screen or package them as appropriate.'],importance:'Vermicompost can create a compact, higher-value soil product from suitable farm organics.',considerations:'Maintain correct moisture and temperature. Use only mature inputs to protect the worm population.'},
        {id:'briquettes',icon:'🔥',name:'Dung fuel briquettes',category:'Energy',animals:'Cattle · buffalo',summary:'Clean, dried dung can be converted into fuel briquettes where permitted and where clean-burning alternatives are not available.',steps:['Collect dung from clean areas and separate non-organic contaminants.','Dry or process it using a controlled, hygienic method.','Form briquettes with appropriate equipment and dry fully before storage.','Store away from moisture and use only in suitable, ventilated appliances.'],importance:'Can provide a locally available fuel option and reduce loose-waste accumulation.',considerations:'Burning biomass creates smoke and air-pollution risks. Prioritise clean energy where available and always use adequate ventilation.'},
        {id:'litter',icon:'🌾',name:'Poultry-litter soil input',category:'Farm input',animals:'Chickens · turkeys · ducks',summary:'Managed poultry litter can be composted or treated under an approved nutrient plan for agricultural soil use.',steps:['Remove litter from houses using protective equipment.','Keep it covered and separated from watercourses and drainage paths.','Compost or treat it according to a nutrient-management plan.','Apply only at rates suitable for the crop and soil, with required setback distances.'],importance:'Properly managed litter can recycle valuable nutrients back into cropping systems.',considerations:'Pathogen, ammonia, and water-contamination risks require careful storage, treatment, and local compliance.'}
      ];

re{content:counter(step);position:absolute;left:11px;top:10px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--pale);color:var(--green);font-weight:850;font-size:11px}.product-callout{margin:15px 0;padding:12px;border-left:4px solid var(--green);border-radius:8px;background:#f3f9f3;font-size:12px;color:#365c3e}.product-safety{padding:12px;border-left:4px solid var(--amber);border-radius:8px;background:var(--amber-bg);font-size:12px;color:#714508}.product-detail-icon{font-size:41px;margin-bottom:5px}.back-link{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:850;padding:0;cursor:pointer}@media(max-width:800px){.product-guide{grid-template-columns:1fr}}

      function showGuide(id){const product=products.find(item=>item.id===id);const main=document.querySelector('#app main');if(!product||!main)return;main.innerHTML=`<header class="top"><div><div class="eyebrow">Livestock products</div><button class="back-link" id="back-to-products">← Back to product library</button><h1>${product.icon} ${safe(product.name)}</h1><p>${safe(product.animals)}</p></div></header><div class="product-guide"><section class="card product-guide-main"><h2>How it is made</h2><ol class="product-steps">${product.steps.map(step=>`<li>${safe(step)}</li>`).join('')}</ol><div class="product-callout"><strong>Why it matters</strong><br>${safe(product.importance)}</div></section><aside class="card product-guide-aside"><div class="product-detail-icon">${product.icon}</div><h2>About this product</h2><p>${safe(product.summary)}</p><div class="product-safety"><strong>Important consideration</strong><br>${safe(product.considerations)}</div><button class="button primary" id="ask-aashu-product" style="margin-top:15px">Ask Aashu about this product</button></aside></div><p class="footer">Guidance is educational. Follow local food safety, waste handling, environmental, energy, and licensing requirements before producing or selling livestock products.</p>`;document.getElementById('back-to-products').onclick=showLivestock;document.getElementById('ask-aashu-product').onclick=()=>window.HerdCareAashu?.ask(`Tell me the key health, animal-welfare, hygiene, and safety questions I should consider for ${product.name}.`)}
      function showLivestock(){const main=document.querySelector('#app main');if(!main)return;const navButton=document.querySelector('[data-livestock-page]');if(navButton)setNav(navButton);main.innerHTML=`<header class="top"><div><div class="eyebrow">Farm value & circular resources</div><h1>Livestock</h1><p>Explore products from animal husbandry and responsibly managed farm by-products.</p></div></header><div class="livestock-intro"><span>♻</span><div><b>From animal care to useful products</b><p>Explore food, fibre, soil-input, and energy pathways—designed around animal welfare, hygiene, and responsible waste management.</p></div></div><div class="livestock-filter" id="livestock-filter">${['All','Food','Materials','Farm input','Energy'].map(category=>`<button class="${category==='All'?'active':''}" data-product-category="${category}">${category}</button>`).join('')}</div><section class="product-grid" id="product-grid"></section><p class="footer">These templates are educational starting points, not operating procedures. Confirm local rules, safety requirements, and professional advice before producing or selling products.</p>`;document.querySelectorAll('[data-product-category]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-product-category]').forEach(item=>item.classList.toggle('active',item===button));renderCards(button.dataset.productCategory)});renderCards('All')}

      new MutationObserver(addNav).observe(document.getElementById('app'),{childList:true,subtree:true});addNav();

  <script>
    (()=>{
      const STORAGE_KEY='herdcare-working-prototype-v1';
      const readState=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return{}}};
      const writeState=state=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      const safe=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
      const fileUrl=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
      const closePhotoModal=()=>{document.getElementById('modal')?.classList.remove('open');document.querySelector('#modal .modal-box')?.classList.remove('ai-photo-modal')};
      const openPhotoModal=(title,copy,body,submitLabel='Save',onSubmit=()=>{})=>{const modal=document.getElementById('modal'),box=modal?.querySelector('.modal-box'),form=document.getElementById('modal-form');if(!modal||!box||!form)return;box.classList.add('ai-photo-modal');document.getElementById('modal-title').textContent=title;document.getElementById('modal-copy').textContent=copy;form.innerHTML=body+`<div class="modal-actions"><button class="button ghost" type="button" data-ai-close>Cancel</button><button class="button primary" type="submit">${safe(submitLabel)}</button></div>`;modal.classList.add('open');form.querySelector('[data-ai-close]').onclick=closePhotoModal;form.onsubmit=onSubmit};
      const scanImage=source=>new Promise(resolve=>{const image=new Image();image.onload=()=>{const width=Math.min(96,image.naturalWidth),height=Math.max(1,Math.round(image.naturalHeight*(width/image.naturalWidth))),canvas=document.createElement('canvas');canvas.width=width;canvas.height=Math.min(96,height);const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0,canvas.width,canvas.height);const pixels=context.getImageData(0,0,canvas.width,canvas.height).data,lights=[],reds=[];let edge=0,previous=0;for(let i=0;i<pixels.length;i+=4){const r=pixels[i],g=pixels[i+1],b=pixels[i+2],light=(r+g+b)/3;lights.push(light);reds.push(r>g*1.16&&r>b*1.16?1:0);if(i>0)edge+=Math.abs(light-previous);previous=light}const mean=lights.reduce((a,b)=>a+b,0)/lights.length,variance=lights.reduce((sum,value)=>sum+(value-mean)**2,0)/lights.length,contrast=Math.sqrt(variance),redShare=reds.reduce((a,b)=>a+b,0)/reds.length,detail=edge/Math.max(1,lights.length-1),resolution=image.naturalWidth*image.naturalHeight;const quality=resolution<180000?'Low resolution—retake closer in good light if possible.':mean<48?'The image is dark; a brighter retake may improve the match.':mean>220?'The image is overexposed; reduce glare for a clearer review.':contrast<22?'The image has low contrast; include the affected area and nearby healthy tissue.':'Image quality is suitable for a preliminary visual match.';const signals=[];if(redShare>.09)signals.push('prominent red-toned area');if(detail>33)signals.push('high local texture/edge change');if(contrast>55)signals.push('strong colour or surface contrast');if(!signals.length)signals.push('no dominant colour signal');resolve({quality,signals,redShare,detail,contrast,width:image.naturalWidth,height:image.naturalHeight})};image.onerror=()=>resolve({quality:'The image could not be sampled reliably; the symptom details were used instead.',signals:['image sampling unavailable'],redShare:0,detail:0,contrast:0,width:0,height:0});image.src=source});
      const isPet=animal=>['Dog','Cat'].includes(animal.species);
      const isRuminant=animal=>['Cow','Buffalo','Goat','Sheep'].includes(animal.species);
      const knowledgeUrl=(condition,species)=>`https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(`${condition} ${species} veterinary`)}`;
      const conditionCatalog=(animal,area)=>{
        const pet=isPet(animal),ruminant=isRuminant(animal),catalog={
          skin:[
            {name:'Dermatitis or skin inflammation',terms:/red|rash|itch|crust|hair loss|skin|coat|lick|scrat/i,reason:'Visible redness, irritation, coat change, or repeated rubbing can fit this pattern.',treatment:'Gentle cleaning and protection from licking or flies may be useful first aid. A veterinarian may select anti-inflammatory, antimicrobial, antifungal, or allergy treatment after examination.',diet:'Keep fresh water available and continue a balanced species-appropriate diet. Adequate protein and trace minerals support skin repair, but avoid unverified supplements or sudden ration changes.'},
            {name:pet?'Allergy or ectoparasite-associated skin disease':'Ectoparasites, ringworm, or contact dermatitis',terms:/tick|flea|mite|parasite|ring|patch|itch|scrat/i,reason:'Patchy hair loss, itching, scaling, or multiple affected animals may fit parasite, fungal, or allergic disease.',treatment:'Separate shared grooming tools and keep bedding clean. A veterinarian should confirm whether antiparasitic, antifungal, or other therapy is appropriate for this species.',diet:'Continue the usual complete diet and clean water. For a suspected food allergy in pets, use only a veterinarian-designed elimination diet rather than removing foods at random.'},
            {name:'Wound, abscess, or localized infection',terms:/wound|cut|swelling|pus|abscess|injur|bleed/i,reason:'A focal break in the skin, swelling, discharge, or heat can fit a wound or localized infection.',treatment:'Protect the area from contamination and stop active bleeding with gentle pressure if safe. A veterinarian may need drainage, wound care, pain control, or antimicrobials.',diet:'Offer normal familiar food and water. Animals healing from wounds need adequate energy and protein; a veterinarian or nutritionist should adjust rations for poor appetite or production animals.'}
          ],
          eye:[
            {name:'Conjunctival irritation or infection',terms:/red|discharge|tear|eye|swollen/i,reason:'Redness, tearing, discharge, or eyelid swelling can fit conjunctival inflammation.',treatment:'Keep the eye clean with veterinarian-approved sterile rinse only. A veterinarian must check for infection or foreign material before selecting drops.',diet:'Maintain hydration and the normal complete diet. Diet does not replace eye treatment; sudden appetite loss raises urgency.'},
            {name:'Corneal injury or ulcer',terms:/cloud|squint|pain|scratch|injur|closed eye/i,reason:'Squinting, cloudiness, light sensitivity, or trauma can indicate a painful corneal problem.',treatment:'Prevent rubbing and seek same-day veterinary examination. Do not use leftover or steroid eye drops because some products can worsen an ulcer.',diet:'Offer familiar food and clean water in an easy-to-reach place. If pain prevents eating or drinking, seek urgent care.'},
            {name:'Respiratory-linked eye or nasal disease',terms:/cough|nasal|sneeze|breath|fever|discharge/i,reason:'Eye discharge together with nasal discharge, cough, fever, or group spread can accompany respiratory disease.',treatment:'Reduce dust, improve ventilation, and separate an affected animal when safe. A veterinarian can decide whether testing and targeted medication are needed.',diet:'Provide fresh water and palatable familiar feed. Do not force-feed an animal that is struggling to breathe.'}
          ],
          mouth:[
            {name:ruminant?'Oral or vesicular disease pattern':'Dental or oral inflammation',terms:/blister|drool|ulcer|mouth|gum|tooth|tongue/i,reason:ruminant?'Drooling, oral sores, or blisters in cloven-hoofed animals require rapid veterinary assessment, including exclusion of reportable disease.':'Red gums, oral sores, drooling, or chewing difficulty can fit dental or oral disease.',treatment:ruminant?'Isolate safely and contact a veterinarian or local animal-health authority promptly; do not move affected animals until advised.':'A veterinarian may provide dental treatment, pain relief, or targeted antimicrobial care after an oral examination.',diet:'Offer soft, palatable, species-appropriate food and easy access to water. Avoid coarse or irritating feed, and do not force-feed.'},
            {name:'Foreign-body or traumatic mouth injury',terms:/stick|thorn|foreign|cut|injur|bleed/i,reason:'A focal injury, sudden drooling, or difficulty chewing can follow trauma or lodged material.',treatment:'Do not reach deeply into the mouth or pull an embedded object. A veterinarian can sedate safely, examine, and treat damaged tissue.',diet:'Until examined, offer water and softer familiar food only if swallowing is comfortable. Withhold hard chews or abrasive fodder.'},
            {name:'Nutritional, toxic, or systemic oral change',terms:/pale|yellow|blue|odor|poison|toxin|weak/i,reason:'Abnormal gum colour, odour, ulceration, or weakness may reflect a systemic or toxic problem rather than a local lesion.',treatment:'Treat this as urgent if gums are pale, blue, or yellow, or if poisoning is possible. Bring product/feed details to the veterinarian.',diet:'Do not give home remedies or new supplements. Keep suspected feed or toxins away and provide water only if the animal can swallow safely.'}
          ],
          limb:[
            {name:'Soft-tissue injury or lameness',terms:/limp|sprain|injur|pain|leg|swelling|walk/i,reason:'Limping, swelling, or pain after activity can fit a soft-tissue or joint injury.',treatment:'Restrict strenuous movement and provide dry, non-slip footing. A veterinarian may recommend imaging and species-appropriate pain control.',diet:'Continue a balanced diet matched to reduced activity. Avoid excess treats, grain, or calories while movement is limited.'},
            {name:pet?'Paw, pad, or nail infection':'Hoof infection or foot rot',terms:/hoof|paw|nail|between toe|smell|rot|pus/i,reason:'A lesion between toes, damaged nail/hoof, odour, or discharge can fit a local infection.',treatment:'Keep the foot clean and dry without aggressive trimming. A veterinarian may need to examine, drain, bandage, or prescribe targeted treatment.',diet:'Keep normal feed and clean water available. Good mineral nutrition supports hoof quality, but do not add high-dose minerals without ration review.'},
            {name:'Joint swelling or deeper infection',terms:/joint|hot|fever|cannot stand|severe|swelling/i,reason:'Marked heat, joint swelling, fever, or inability to bear weight needs prompt examination.',treatment:'Minimize movement and contact a veterinarian urgently if the animal cannot stand or bear weight. Medication depends on the cause and species.',diet:'Place water and familiar food within easy reach. Reduced intake, fever, or inability to rise requires urgent care rather than dietary treatment alone.'}
          ],
          udder:[
            {name:'Mastitis pattern',terms:/milk|udder|hot|clot|mastitis|swelling|pain/i,reason:'Heat, pain, swelling, or abnormal milk can fit mastitis and should be assessed promptly.',treatment:'Keep the udder clean and follow farm biosecurity. A veterinarian may use milk testing and prescribe targeted intramammary or systemic treatment with withdrawal instructions.',diet:'Provide abundant clean water and keep the established lactation ration consistent. Do not suddenly increase concentrate; monitor intake and rumination.'},
            {name:'Teat or udder trauma',terms:/cut|bruise|kick|wound|bleed|injur/i,reason:'A focal cut, bruise, or swelling can follow trauma during housing, milking, or nursing.',treatment:'Protect from contamination and use clean milking practice. A veterinarian should assess deep injury, bleeding, or teat-canal damage.',diet:'Maintain normal feed and hydration to support recovery. Follow any milk-discard or withdrawal instructions from the veterinarian.'},
            {name:'Localized abscess or blocked gland',terms:/lump|hard|abscess|block|pus/i,reason:'A firm focal lump or discharge may reflect blockage or localized infection.',treatment:'Do not squeeze or lance the area. Veterinary examination can determine whether drainage, imaging, or medication is needed.',diet:'Continue the normal balanced ration and water. Track milk yield and appetite; falling intake or fever increases urgency.'}
          ],
          digestive:[
            {name:pet?'Gastroenteritis pattern':'Enteritis, parasitism, or infectious diarrhoea',terms:/diarr|vomit|stool|manure|blood|mucus|worm/i,reason:'Loose stool, vomiting, blood/mucus, or multiple affected animals can fit digestive inflammation or infection.',treatment:'Prevent dehydration and collect a fresh stool sample if safe. A veterinarian may recommend fluids, testing, deworming, or targeted medication after identifying the cause.',diet:pet?'Keep water available; if not repeatedly vomiting and a veterinarian agrees, offer small portions of a familiar easily digested complete food. Avoid fatty foods and sudden diet changes.':'Provide clean water and familiar good-quality forage. Avoid sudden grain changes and isolate contaminated feed; a veterinarian or nutritionist should adjust the ration.'},
            {name:'Diet-related digestive upset',terms:/new feed|diet|grain|spoiled|change|bloat|gas/i,reason:'A recent ration change, spoiled feed, overeating, or sudden gas can produce digestive signs.',treatment:'Remove suspected spoiled feed and contact a veterinarian promptly for bloat, repeated vomiting, severe pain, or rapid deterioration.',diet:'Return only to a safe, familiar ration under veterinary guidance. Make future ration changes gradually; do not force-feed or give oils/home remedies without advice.'},
            {name:'Toxin, obstruction, or systemic illness',terms:/poison|toxin|foreign|not eat|collapse|pain|bloated/i,reason:'Severe pain, repeated vomiting, collapse, sudden bloat, or suspected toxin exposure can signal an emergency.',treatment:'Contact a veterinarian or poison service immediately. Do not induce vomiting or give medication unless a professional instructs you.',diet:'Withhold unapproved foods and remedies. Offer nothing by mouth if swallowing is unsafe or obstruction is suspected; follow emergency veterinary instructions.'}
          ],
          respiratory:[
            {name:'Upper or lower respiratory inflammation',terms:/cough|nasal|sneeze|breath|wheeze|discharge/i,reason:'Cough, nasal discharge, rapid breathing, or group spread can fit respiratory disease.',treatment:'Improve ventilation, reduce dust, and separate the animal if safe. A veterinarian may recommend examination, testing, and targeted medication.',diet:'Provide clean water and palatable familiar feed. Do not force-feed during breathing difficulty; urgent care is needed for laboured or open-mouth breathing.'},
            {name:'Allergic or environmental airway irritation',terms:/dust|smoke|allergy|season|wheeze/i,reason:'Dust, smoke, mould, or seasonal exposure may irritate the airways.',treatment:'Move away from smoke/dust and improve air quality. Persistent wheeze or breathing effort still requires veterinary examination.',diet:'Keep the normal diet and hydration. Replace mouldy feed or bedding; do not add supplements as a substitute for respiratory care.'},
            {name:'Pneumonia or systemic infection pattern',terms:/fever|weak|not eat|rapid breath|group/i,reason:'Fever, weakness, poor appetite, or rapid breathing can indicate deeper infection.',treatment:'Contact a veterinarian the same day; severe breathing difficulty is an emergency. Antibiotics or other medicines require examination and species-specific prescribing.',diet:'Place water and familiar feed within easy reach. Poor intake or dehydration may require veterinarian-directed fluid and nutrition support.'}
          ],
          other:[
            {name:'Localized inflammation or injury',terms:/red|swelling|pain|wound|injur/i,reason:'The photo and notes suggest a focal visible change, but the body area is not specific enough for a narrower match.',treatment:'Protect the area and arrange veterinary review if it is painful, spreading, draining, or worsening.',diet:'Continue clean water and the normal balanced diet unless the veterinarian advises otherwise.'},
            {name:'Infection requiring examination',terms:/pus|fever|discharge|smell|infect/i,reason:'Discharge, odour, fever, or worsening swelling can fit infection.',treatment:'A veterinarian should examine and decide whether sampling, drainage, or prescription medication is needed.',diet:'Maintain hydration and familiar food. Reduced appetite, fever, or weakness raises urgency.'},
            {name:'Non-specific visible health change',terms:/.*/,reason:'A photo alone may not separate normal variation, irritation, injury, and disease.',treatment:'Retake clear photos over time and seek veterinary assessment if the change persists or the animal seems unwell.',diet:'Use a complete species-appropriate diet and avoid unverified supplements or abrupt ration changes.'}
          ]
        };return catalog[area]||catalog.other;
      };
      const supportiveDiet=(animal,area,top)=>{if(area==='digestive')return top.diet;if(area==='mouth')return 'Use soft, palatable, species-appropriate food and easy access to fresh water. Avoid coarse feed, bones, hard chews, and force-feeding until swallowing and oral pain are assessed.';if(area==='respiratory')return 'Offer fresh water and small amounts of familiar palatable food. Keep feed dust low and never force-feed an animal with breathing difficulty.';if(area==='udder')return 'Maintain clean water and the established lactation ration without sudden concentrate changes. Record appetite, rumination, and milk change, and follow any milk-withdrawal instruction.';if(isPet(animal))return 'Continue the usual complete pet food and fresh water. Smaller familiar meals may help if appetite is mildly reduced, but no food or supplement treats the underlying condition.';return 'Continue clean water and the usual good-quality forage or balanced ration. Avoid sudden feed changes or high-dose supplements; ask a veterinarian or nutritionist to adjust intake if appetite or production falls.'};
      const vaccinationAdvice=animal=>isPet(animal)?'Vaccines prevent disease; they do not treat the current problem. Ask the veterinarian to review rabies and species-specific core vaccines after the animal is clinically well.':`Vaccines prevent disease; they do not treat the current problem. Ask the local veterinarian to review regionally approved prevention for ${safe(animal.species)}—for example FMD and other locally relevant programmes—after examining the animal and deciding it is fit to vaccinate.`;
      const predict=(animal,area,details,imageScan)=>{const q=details.toLowerCase(),temperature=Number(animal.temp),base=conditionCatalog(animal,area);return base.map((item,index)=>{let score=64-index*11;if(item.terms.test(q))score+=11;if(imageScan.redShare>.09&&/inflammation|wound|infection|mastitis|dermatitis|injury/i.test(item.name))score+=5;if(imageScan.detail>33&&/parasite|wound|injury|ulcer|dermatitis/i.test(item.name))score+=3;if(Number.isFinite(temperature)&&temperature>=40&&/infection|mastitis|pneumonia|enteritis/i.test(item.name))score+=7;if(/not eat|off feed|weak|fever|blood|pus|cannot stand|breath/i.test(q))score+=4;return{...item,score:clamp(score,24,91),knowledge:knowledgeUrl(item.name,animal.species)}}).sort((a,b)=>b.score-a.score)};
      const urgencyFor=(details,animal)=>{const q=details.toLowerCase();return /collapse|cannot stand|heavy bleed|severe bleed|blue gum|poison|toxin|open-mouth breath|difficulty breath|difficult calv|seizure/i.test(q)||Number(animal.temp)>=40?'urgent':/blood|pus|fever|not eat|off feed|limp|vomit|diarr|wound|swelling|discharge|squint/i.test(q)?'prompt':'monitor'};
      const vetMarkup=(state,location)=>{const vets=(state.vets||[]).slice(0,3),area=(location||state.weather?.name||'your area').replace(/\s*\(demo\)\s*/i,'');return `<div class="ai-photo-section"><h3>Nearby veterinary help · ${safe(area)}</h3>${vets.length?vets.map(vet=>`<div class="ai-vet-result"><div><strong>${safe(vet.name)} · ${safe(vet.distance||'Local')}</strong><small>${safe(vet.clinic)}<br>${safe(vet.address)} · ${safe(vet.open||'Hours not recorded')}</small></div><div><a href="tel:${safe(vet.phone)}" title="Call ${safe(vet.name)}">Call</a><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(vet.address)}">Map</a></div></div>`).join(''):'<p>No saved veterinarian contacts yet.</p>'}<a class="button ghost" style="display:inline-block;margin-top:9px;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`veterinarian near ${area}`)}">Search verified vets near ${safe(area)} on Google Maps ↗</a></div>`};
      const showResult=(state,animal,review)=>{const modal=document.getElementById('modal'),box=modal?.querySelector('.modal-box'),form=document.getElementById('modal-form');if(!modal||!box||!form)return;box.classList.add('ai-photo-modal');document.getElementById('modal-title').textContent='AI Photo Check result';document.getElementById('modal-copy').textContent=`Ranked visual matches for ${animal.name} · preliminary support, not a confirmed diagnosis.`;const urgency={urgent:['Urgent veterinary assessment','danger'],prompt:['Veterinary review recommended today','warn'],monitor:['Monitor closely and arrange a vet review if it persists','']}[review.urgency];form.innerHTML=`<div class="ai-photo-result"><div class="ai-photo-hero"><img class="ai-photo-thumb" src="${review.photo}" alt="Uploaded health-check photo"><div><span class="ai-photo-chip">Open-knowledge visual triage</span><strong>${safe(urgency[0])}</strong><p>${safe(review.image.quality)} Detected image signal: ${safe(review.image.signals.join(', '))}.</p></div></div><div class="ai-photo-section"><h3>Possible condition matches</h3>${review.matches.map(match=>`<div class="ai-photo-match"><div class="ai-match-score" style="--score:${match.score*3.6}deg"><span>${match.score}%</span></div><div><h4>${safe(match.name)}</h4><p>${safe(match.reason)}</p><p><b>Treatment path to discuss:</b> ${safe(match.treatment)}</p><p><b>Diet while unwell:</b> ${safe(match.diet)}</p><a href="${match.knowledge}" target="_blank" rel="noopener">Review open-knowledge references ↗</a></div></div>`).join('')}</div><div class="ai-photo-options"><div class="ai-photo-callout ${safe(urgency[1])}"><strong>Medication / treatment options</strong>These are veterinarian discussion options, not a prescription. Do not start antibiotics, steroids, painkillers, dewormers, eye drops, or human medicines from this result. The correct product, dose, duration, contraindications, and milk/meat withdrawal period depend on examination and the animal’s species, weight, age, pregnancy, and medical history.</div><div class="ai-photo-callout"><strong>Supportive diet while unwell</strong>${safe(review.diet)}</div></div><div class="ai-photo-callout warn"><strong>Vaccination context</strong>${vaccinationAdvice(animal)}</div>${vetMarkup(state,review.location)}<div class="ai-photo-disclaimer"><b>How to read the percentages:</b> these are relative match estimates from the selected body area, written symptoms, animal profile, temperature, and basic on-device image signals. They are not calibrated diagnostic probabilities. Exact diagnosis and any prescription require a qualified veterinarian.</div></div><div class="modal-actions"><button class="button ghost" type="button" data-ai-vets>Open Find a vet</button><button class="button primary" type="button" data-ai-close>Done</button></div>`;form.querySelector('[data-ai-close]').onclick=closePhotoModal;form.querySelector('[data-ai-vets]').onclick=()=>{closePhotoModal();location.hash='vets';location.reload()};form.onsubmit=event=>event.preventDefault();modal.classList.add('open')};
      const startCheck=()=>{const state=readState(),animal=(state.cattle||[]).find(item=>item.id===state.selected)||(state.cattle||[])[0],defaultLocation=(state.weather?.name||'').replace(/\s*\(demo\)\s*/i,'');if(!animal)return;openPhotoModal('AI Photo Check',`Upload a clear image of ${animal.name}’s affected area. The on-device scan combines image signals with species, temperature, and symptoms to rank possible conditions.`,`<label>Photo of the physical problem<input type="file" name="photo" accept="image/*" capture="environment" required></label><label>Affected area<select name="area"><option value="skin">Skin / coat / wound</option><option value="eye">Eye / face</option><option value="mouth">Mouth / gums</option><option value="limb">Hoof / paw / leg / joint</option>${isRuminant(animal)?'<option value="udder">Udder / teat</option>':''}<option value="digestive">Stool / vomit / digestive sign</option><option value="respiratory">Nose / breathing / respiratory sign</option><option value="other">Other visible problem</option></select></label><label>What can you see or what changed?<textarea name="details" required placeholder="Example: Red swollen patch with hair loss for three days; appetite is lower."></textarea></label><label>How long has it been present?<select name="duration"><option>Started today</option><option>1–3 days</option><option>4–7 days</option><option>More than a week</option></select></label><label>Eating and drinking<select name="appetite"><option>Normal</option><option>Slightly reduced</option><option>Not eating or drinking</option></select></label><label>Area or city for nearby vets<input name="location" value="${safe(defaultLocation)}" placeholder="e.g. Patna, Bihar"></label><div class="ai-photo-scan-note">For a better match: use natural light, keep the affected area in focus, and include some nearby healthy tissue. Photos stay in this browser in this prototype.</div>`,'Analyze photo',async event=>{event.preventDefault();const form=event.currentTarget,file=form.elements.photo.files?.[0];if(!file)return;const submit=form.querySelector('[type="submit"]');submit.disabled=true;submit.textContent='Analyzing…';try{const photo=await fileUrl(file),image=await scanImage(photo),area=form.elements.area.value,location=form.elements.location.value.trim()||defaultLocation||'your area',details=`${form.elements.details.value}. ${form.elements.duration.value}. Appetite: ${form.elements.appetite.value}.`,matches=predict(animal,area,details,image),urgency=urgencyFor(details,animal),review={at:new Date().toLocaleString(),area,location,details,image,matches,urgency,diet:supportiveDiet(animal,area,matches[0]),photo};animal.healthPhoto=photo;animal.lastPhotoReview={at:review.at,area,location,urgency,matches:matches.map(({name,score})=>({name,score})),diet:review.diet};animal.notes=animal.notes||[];animal.notes.unshift({date:review.at,title:'AI Photo Check',detail:`${matches[0].name} (${matches[0].score}% preliminary match). Veterinary confirmation required.`,label:urgency==='urgent'?'Urgent':'AI review'});writeState(state);decorate();showResult(state,animal,review)}catch(error){submit.disabled=false;submit.textContent='Analyze photo';alert('The photo could not be analyzed. Please try another image.')}})};
      const decorate=()=>{const state=readState(),animal=(state.cattle||[]).find(item=>item.id===state.selected)||(state.cattle||[])[0],check=document.querySelector('.photo-check');if(!animal||!check)return;const section=check.closest('section'),review=animal.lastPhotoReview,stamp=review?.at||'empty';if(section?.dataset.aiPhotoStamp===stamp)return;if(section)section.dataset.aiPhotoStamp=stamp;const heading=section?.querySelector('.head h2'),action=section?.querySelector('.head [data-action="photo"]'),preview=check.querySelector('.photo-preview'),list=check.querySelector('.checklist');if(heading)heading.textContent='AI Photo Check';if(action)action.textContent=review?'Scan new photo':'Start AI scan';if(preview&&animal.healthPhoto)preview.innerHTML=`<img src="${animal.healthPhoto}" alt="Latest AI Photo Check for ${safe(animal.name)}"><small>Latest AI Photo Check · saved locally</small>`;if(list)list.innerHTML=review?`<div class="check">Top preliminary match: ${safe(review.matches?.[0]?.name||'Review saved')} · ${safe(review.matches?.[0]?.score||0)}%</div><div class="check">Treatment, vaccination and disease-specific diet guidance included</div><div class="check">Nearby veterinarian details and directions included</div><button class="link" data-action="photo">Run another analysis →</button>`:`<div class="check">Ranks possible conditions with match percentages</div><div class="check">Adds treatment, vaccination and supportive diet options</div><div class="check warn">A veterinarian confirms diagnosis and prescriptions</div><button class="link" data-action="photo">Start AI Photo Check →</button>`};
      document.addEventListener('click',event=>{const target=event.target.closest?.('[data-action="photo"]');if(!target)return;event.preventDefault();event.stopImmediatePropagation();startCheck()},true);
      const root=document.getElementById('app');if(root)new MutationObserver(decorate).observe(root,{childList:true,subtree:true});decorate();

  <script>
    /* Unified notification centre for temperature, geofence and care reminders. */
    (()=>{
      const APP_KEY='herdcare-working-prototype-v1',GPS_KEY='herdcare-gps-geofence-v1',READ_KEY='herdcare-notification-read-v1';
      const safe=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const readJson=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};
      const getRead=()=>readJson(READ_KEY,{});
      const saveRead=value=>localStorage.setItem(READ_KEY,JSON.stringify(value));
      const fingerprint=item=>`${item.severity}|${item.title}|${item.body}`;
      const gpsDistance=gps=>Math.round(Math.hypot(Number(gps.current?.x)-50,Number(gps.current?.y)-50)*10);
      const notifications=()=>{
        const state=readJson(APP_KEY,{cattle:[]}),items=[];
        (state.cattle||[]).forEach(animal=>{
          const analysis=window.HerdCareTemperature?.analyze?.(animal.id);
          if(analysis&&analysis.level!=='stable'){
            const urgent=analysis.level==='urgent';
            items.push({id:`temperature:${animal.id}`,type:'temperature',severity:urgent?'urgent':'warning',icon:'♨',title:`${animal.name}: ${urgent?'urgent':'irregular'} temperature pattern`,body:`Optimized ${analysis.optimized.toFixed(1)}°C is ${Math.abs(analysis.delta).toFixed(1)}°C ${analysis.delta>=0?'above':'below'} the predicted normal.`,action:'sensor',actionLabel:'Review temperature'});
          }
          (animal.meds||[]).forEach((reminder,index)=>{
            if(/today|overdue|now|due$/i.test(String(reminder.due||'').trim()))items.push({id:`care:${animal.id}:${index}:${reminder.name}`,type:'care',severity:/overdue/i.test(reminder.due)?'urgent':'info',icon:'◒',title:`${animal.name}: ${reminder.name}`,body:`Care reminder is due ${String(reminder.due).toLowerCase()}. ${reminder.detail||''}`.trim(),action:'diet',actionLabel:'Open care plan'});
          });
          if(animal.lastPhotoReview?.urgency==='urgent')items.push({id:`photo:${animal.id}:${animal.lastPhotoReview.at||''}`,type:'care',severity:'urgent',icon:'✦',title:`${animal.name}: urgent photo review`,body:'The latest AI Photo Check recommends urgent veterinary assessment.',action:'vets',actionLabel:'Find a vet'});
        });
        const gps=readJson(GPS_KEY,null);
        if(gps?.current){const distance=gpsDistance(gps),radius=Number(gps.radius)||250;if(distance>radius){const animal=(state.cattle||[]).find(item=>item.id===gps.animalId)||state.cattle?.[0]||{name:'Tracked animal'};items.unshift({id:`geofence:${gps.animalId||'animal'}`,type:'location',severity:'urgent',icon:'⌖',title:`${animal.name} left the designated area`,body:`Tracker is ${distance-radius} m beyond the ${radius} m safety radius.`,action:'gps',actionLabel:'View GPS location'})}}
        const rank={urgent:0,warning:1,info:2};return items.sort((a,b)=>rank[a.severity]-rank[b.severity]);
      };
      const styles=document.createElement('style');styles.textContent=`
        .notification-root{position:relative;z-index:45;flex:none}.notification-bell{position:relative;width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--forest);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 15px #173d2a12}.notification-bell:hover,.notification-bell[aria-expanded=true]{border-color:#a9c9ae;background:#f3f9f3}.notification-bell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.notification-badge{position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;padding:0 5px;border:2px solid #fff;border-radius:99px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:900}.notification-badge[hidden]{display:none}.notification-panel{position:absolute;right:0;top:50px;width:min(390px,calc(100vw - 30px));max-height:min(590px,72vh);overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 22px 58px #173d2a2b}.notification-panel[hidden]{display:none}.notification-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}.notification-panel-head strong{display:block;font-size:14px}.notification-panel-head small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.notification-read-all{border:0;background:transparent;color:var(--green);font-size:10px;font-weight:850;cursor:pointer}.notification-list{max-height:490px;overflow:auto}.notification-item{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:13px 14px;border:0;border-bottom:1px solid #edf1ed;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.notification-item:hover{background:#f7faf7}.notification-item.unread{background:#f3f9f3}.notification-item.warning .notification-item-icon{background:var(--amber-bg);color:var(--amber)}.notification-item.urgent .notification-item-icon{background:var(--red-bg);color:var(--red)}.notification-item-icon{width:32px;height:32px;border-radius:9px;background:#eaf4eb;color:var(--green);display:grid;place-items:center;font-size:15px;font-weight:900}.notification-item strong{display:block;font-size:12px;line-height:1.35}.notification-item p{margin:3px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.notification-item-action{align-self:center;color:var(--green);font-size:15px}.notification-empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:11px}.notification-empty span{display:block;margin-bottom:7px;color:var(--green);font-size:24px}.notification-panel-foot{padding:10px 14px;background:#f8faf8;color:var(--muted);font-size:9px;text-align:center}.top>.tools .notification-root:first-child{order:-1}@media(max-width:720px){.notification-panel{position:fixed;left:15px;right:15px;top:74px;width:auto;max-height:calc(100vh - 95px)}.notification-list{max-height:calc(100vh - 210px)}.notification-bell{width:41px}.tools .notification-root{flex:0 0 auto}}
      `;document.head.append(styles);
      const go=action=>{if(action==='gps'){document.querySelector('[data-gps-page]')?.click();return}document.querySelector(`[data-page="${action}"]`)?.click()};
      const renderRoot=root=>{
        const items=notifications(),read=getRead(),unread=items.filter(item=>read[item.id]!==fingerprint(item)).length,wasOpen=root.querySelector('.notification-panel')&&!root.querySelector('.notification-panel').hidden;
        const signature=JSON.stringify({items:items.map(item=>[item.id,fingerprint(item)]),read,wasOpen});if(root.dataset.signature===signature)return;root.dataset.signature=signature;
        root.innerHTML=`<button class="notification-bell" type="button" aria-label="Notifications${unread?` — ${unread} unread`:''}" aria-expanded="${wasOpen}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg><span class="notification-badge" ${unread?'':'hidden'}>${unread>99?'99+':unread}</span></button><section class="notification-panel" aria-label="Notification centre" ${wasOpen?'':'hidden'}><div class="notification-panel-head"><div><strong>Notifications</strong><small>${unread?`${unread} unread update${unread===1?'':'s'}`:'You’re all caught up'}</small></div>${items.length?'<button class="notification-read-all" type="button">Mark all read</button>':''}</div><div class="notification-list">${items.length?items.map(item=>`<button class="notification-item ${item.severity} ${read[item.id]===fingerprint(item)?'':'unread'}" type="button" data-notification-id="${safe(item.id)}" data-notification-action="${safe(item.action)}"><span class="notification-item-icon">${safe(item.icon)}</span><span><strong>${safe(item.title)}</strong><p>${safe(item.body)} · ${safe(item.actionLabel)}</p></span><span class="notification-item-action">›</span></button>`).join(''):'<div class="notification-empty"><span>✓</span>No active irregular patterns or important care reminders.</div>'}</div><div class="notification-panel-foot">Alerts update from sensor readings, GPS boundaries and saved care records.</div></section>`;
        const bell=root.querySelector('.notification-bell'),panel=root.querySelector('.notification-panel');bell.onclick=event=>{event.stopPropagation();panel.hidden=!panel.hidden;bell.setAttribute('aria-expanded',String(!panel.hidden));root.dataset.signature=''};
        root.querySelector('.notification-read-all')?.addEventListener('click',event=>{event.stopPropagation();const next=getRead();items.forEach(item=>next[item.id]=fingerprint(item));saveRead(next);renderRoot(root)});
        root.querySelectorAll('[data-notification-id]').forEach(button=>button.onclick=()=>{const item=items.find(entry=>entry.id===button.dataset.notificationId);if(!item)return;const next=getRead();next[item.id]=fingerprint(item);saveRead(next);panel.hidden=true;go(item.action);schedule()});
      };
      const mount=()=>{const top=document.querySelector('#app main .top');if(!top)return;let tools=top.querySelector(':scope > .tools');if(!tools){tools=document.createElement('div');tools.className='tools';top.append(tools)}let root=tools.querySelector('.notification-root');if(!root){root=document.createElement('div');root.className='notification-root';tools.prepend(root)}renderRoot(root)};
      let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;mount()})};
      const wrapUpdates=()=>{if(window.HerdCareTemperature&&!window.HerdCareTemperature.__notifications){const original=window.HerdCareTemperature.ingest;window.HerdCareTemperature.ingest=function(...args){const result=original.apply(this,args);schedule();return result};window.HerdCareTemperature.__notifications=true}if(window.HerdCareGPS&&!window.HerdCareGPS.__notifications){const original=window.HerdCareGPS.ingest;window.HerdCareGPS.ingest=function(...args){const result=original.apply(this,args);schedule();return result};window.HerdCareGPS.__notifications=true}};
      document.addEventListener('click',event=>{if(!event.target.closest?.('.notification-root'))document.querySelectorAll('.notification-panel').forEach(panel=>{panel.hidden=true;panel.closest('.notification-root')?.querySelector('.notification-bell')?.setAttribute('aria-expanded','false')})});
      document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.notification-panel').forEach(panel=>{panel.hidden=true;panel.closest('.notification-root')?.querySelector('.notification-bell')?.setAttribute('aria-expanded','false')})});
      window.addEventListener('storage',schedule);new MutationObserver(schedule).observe(document.getElementById('app'),{childList:true,subtree:true});wrapUpdates();mount();setInterval(()=>{wrapUpdates();schedule()},15000);
    })();
  </script>
