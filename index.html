<html lang="en">

  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:var(--forest);color:#f7fff8;padding:25px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:0 9px;font-size:20px;font-weight:850}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--lime);color:var(--forest);font-weight:900}.farm{margin:31px 2px 20px;padding:12px;border-radius:12px;background:#ffffff18;border:1px solid #ffffff15}.farm small,.side-foot{font-size:11px;color:#b8d1be}.farm strong{display:block;margin-top:3px;font-size:13px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#cce0d1;text-align:left;border-radius:9px;padding:11px 12px;font-weight:700;font-size:13px}.nav button:hover,.nav button.active{color:#fff;background:#ffffff20}.nav span{display:inline-block;width:23px}.side-foot{margin-top:auto;padding:0 9px;line-height:1.6}.side-foot strong{color:#e4f2e6;font-size:11px}.main{max-width:1530px;margin:auto;padding:29px 34px 48px;width:100%}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:23px}.eyebrow{font-size:11px;font-weight:850;color:var(--green);letter-spacing:.08em;text-transform:uppercase}.top h1{font-size:28px;letter-spacing:-1px;margin:3px 0 2px}.top p{margin:0;color:var(--muted)}.tools{display:flex;gap:9px}.button{border:1px solid transparent;border-radius:9px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:800;white-space:nowrap}.button.ghost{border-color:var(--line)}.button.primary{background:var(--green);color:#fff;box-shadow:0 5px 12px #216b4635}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.notice{padding:12px 14px;border:1px solid #f0d7ae;border-radius:12px;backgro {padding:19px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:15px}.head h2{font-size:15px;margin:0}.link{border:0;background:transparent;color:var(--green);font-weight:800;font-size:12px;padding:2px}.temp{display:flex;gap:18px;align-items:flex-end}.temp-main{min-width:117px}.temp-main b{font-size:37px;line-height:1;letter-spacing:-2px}.temp-main b span{font-size:16px;letter-spacing:0}.temp-main small{display:block;color:var(--amber);font-size:11px;font-weight:750;margin-top:8px}.trend{height:106px;flex:1;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,#edf2ed 31px,transparent 32px);border-bottom:1px solid var(--line)}.trend svg{position:absolute;inset:4px 0 13px;width:100%;height:83px;overflow:visible}.trend-labels{position:absolute;bottom:-17px;left:0;right:0;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.alerts{display:grid;gap:9px}.alert{padding:10px 11px;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:9px;display:flex;gap:9px}.alert.urgent{border-left-color:var(--red)}.alert-icon{width:22px;height:22px;border-radius:7px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center;font-weight:900;flex:none}.urgent .alert-icon{background:var(--red-bg);color:var(--red)}.alert strong{display:block;font-size:12px}.alert p{font-size:11px;color:var(--muted);margin:2px 0 0}.photo-check{display:grid;grid-template-columns:118px 1fr;gap:13px}.photo-preview{min-height:120px;position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(145deg,#b87043,#e9d1a7 48%,#587d4d);display:grid;place-items:center;font-size:49px}.photo-preview small{position:absolute;bottom:0;left:0;right:0;padding:5px 6px;background:#0007;color:#fff;text-align:center;font-size:10px}.checklist{align-content:center;display:grid;gap:8px}.check{font-size:11px;color:#3d5744}.check:before{content:"✓";font-weight:900;color:va et:0;display:grid;place-items:center;color:#fff;font-weight:900;transform:rotate(45deg)}.pin.a{left:41%;top:39%}.pin.b{left:68%;top:25%;background:var(--amber);scale:.78}.pin.c{left:24%;top:65%;background:var(--red);scale:.7}.vet{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.vet:first-of-type{border-top:0}.vet-avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#d6ebd8;font-size:17px}.vet strong{display:block;font-size:11px}.vet small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.vet-actions{display:flex;gap:4px}.round{border:0;width:30px;height:30px;border-radius:8px;background:#eaf4eb;color:var(--green);display:grid;place-items:center;text-decoration:none;font-weight:900}.round.alt{background:#f3f3ed;color:#666}.page{display:none}.page.active{display:block}.page-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:22px}.page-head h1{font-size:26px;letter-spacing:-.8px;margin:0}.page-head p{color:var(--muted);margin:4px 0 0}.cattle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.animal-card{padding:17px;cursor:pointer;transition:.16s transform,.16s border-color}.animal-card:hover{transform:translateY(-2px);border-color:#adcbaf}.animal-top{display:flex;align-items:center;gap:10px}.tiny-avatar{width:45px;height:45px;border-radius:11px;background:#e6c8aa;display:grid;place-items:center;font-size:26px;overflow:hidden}.animal-card h2{margin:0;font-size:16px}.animal-card p{margin:1px 0;font-size:11px;color:var(--muted)}.animal-stat{margin-top:15px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px}.animal-stat b{color:var(--green)}.two-col{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:20px}.history-row{display:grid;grid-template-columns:105px 1fr auto;gap:15px;padding:13px 0;border-top:1px solid var(--line)}.history-row:first-child{padding-top:0;border-top:0}.history-row h3{font-size:13px;margin:0}.history-row p{font-size:12px;color:var(--muted);margin:3px 0 0}.timeline-date{font-size:11px;color:var(--muted);font-weight:750}.info h2{font-size:15px;margin:0 0 12px}.info p{font-size:12px;color:var(--muted)}.reading{font-size:45px;font-weight:850;letter-spacing:-2px}.reading span{font-size:19px}.range{font-size:11px;color:var(--muted)}.form{display:grid;gap:12px}.form label{font-size:11px;font-weight:800}.form input,.form textarea,.form select{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.form textarea{min-height:78px;resize:vertical}.sensor-control{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f6faf6}.switch{width:42px;height:24px;border:0;border-radius:999px;background:#cbd5cd;position:relative;flex:none}.switch:after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--green)}.switch.on:after{left:21px}.edit-list{display:grid;gap:10px}.edit-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}.edit-row b{display:block;font-size:12px}.edit-row small{display:block;color:var(--muted);font-size:11px}.delete{border:0;border-radius:6px;padding:6px 8px;background:#fff0ef;color:var(--red);font-weight:800}.directory{display:grid;gap:11px}.directory-vet{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;padding:15px}.directory-vet h2{font-size:14px;margin:0}.directory-vet p{font-size:11px;color:var(--muted);margin:3px 0}.emergency{font-size:10px;font-weight:850;color:var(--red)}.modal{display:none;align-items:center;justify-content:center;position:fixed;z-index:20;inset:0;padding:20px;background:#0c221566}.modal.open{display:flex}.modal-box{max-width:520px;max-height:91vh;width:100%;overflow:auto;padding:22px;border-radius:16px;background:#fff;box-shadow:0 24px 60px #0003}.modal-box h2{font-size:20px;letter-spacing:-.5px;margin:0 0 4px}.modal-box>p{font-size:12px;color:var(--muted);margin:0 0 16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{display:none;position:fixed;z-index:30;right:22px;bottom:20px;padding:12px 14px;border-radius:9px;background:var(--forest);color:#fff;box-shadow:var(--shadow)}.toast.show{display:block}.small-note{font-size:11px;color:var(--muted);margin:12px 0 0}.footer{margin:20px 0 0;text-align:center;color:var(--muted);font-size:11px}
    @media(max-width:1060px){.dashboard{grid-template-columns:1fr}.stack.right{grid-template-columns:1fr 1fr;align-items:start}.stack.right .vets-card{grid-column:span 2}.two-col{grid-template-columns:1fr}}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:20px 15px 35px}.top,.page-head{flex-direction:column;align-items:stretch}.tools{width:100%}.tools .button{flex:1}.stack.right{grid-template-columns:1fr}.stack.right .vets-card{grid-column:auto}.profile-bottom{grid-template-columns:1fr}.photo-check{grid-template-columns:100px 1fr}.temp{gap:10px}.temp-main{min-width:96px}.temp-main b{font-size:30px}.history-row{grid-template-columns:70px 1fr}.history-row .mini{display:none}.directory-vet{grid-template-columns:42px 1fr}.directory-vet .vet-actions{grid-column:2}.details{grid-template-columns:repeat(4,1fr)}.details div{padding:6px}.details small{font-size:9px}.details b{font-size:10px}}
    /* Live Maps embeds replace the illustrative clinic map when the prototype is online. */
    .map iframe{display:block;width:100%;height:100%;border:0}

<body>
  <div id="app"></div>
  <div class="modal" id="modal"><div class="modal-box" role="dialog" aria-modal="true"><h2 id="modal-title"></h2><p id="modal-copy"></p><form class="form" id="modal-form"></form></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    const KEY='herdcare-working-prototype-v1';
    const demo={selected:'GV-042',sensorOn:true,cattle:[{id:'GV-042',name:'Bella',type:'Dairy cow',breed:'Holstein',age:'4 years',weight:'546 kg',lastCalved:'14 May',temp:39.6,usual:38.9,photo:'',notes:[{date:'Today, 09:41',title:'Photo health check added',detail:'Automated visual observation saved; eye area marked for review.',label:'New'},{date:'Sep 2, 17:30',title:'Temperature trend elevated',detail:'Connected sensor reading reached 39.4°C.',label:'Monitor'},{date:'Aug 28, 10:15',title:'Routine wellness entry',detail:'Appetite and activity reported as normal.',label:'Normal'}],diet:[['Morning feed','18 kg','Green fodder'],['Concentrate','5 kg','Dairy mix'],['Water target','75 L','Fresh water'],['Supplement','60 g','Mineral mix']],meds:[{name:'Mineral supplement',detail:'60 g with evening feed',due:'Today'},{name:'FMD vaccination',detail:'Next dose due 18 Sep',due:'15 days'}]}],vets:[{name:'Dr. Ananya Sharma',clinic:'Green Cross Veterinary Clinic',address:'12 Farm Road, Green Valley',phone:'+919800123456',distance:'1.8 km',open:'Open now',emoji:'👩🏽‍⚕️',emergency:false},{name:'Dr. Vikram Rao',clinic:'District Animal Hospital',address:'Market Road, Green Valley',phone:'+919800789012',distance:'3.2 km',open:'24-hour service',emoji:'👨🏾‍⚕️',emergency:true},{name:'Dr. Meera Patel',clinic:'Rural Livestock Care',address:'Highway 7, Green Valley',phone:'+919800456789',distance:'4.5 km',open:'Open until 20:00',emoji:'👩🏽‍⚕️',emergency:false}]};
    let state;try{state=JSON.parse(localStorage.getItem(KEY))||demo}catch{state=demo}let page='overview';const app=document.getElementById('app'),modal=document.getElementById('modal'),toast=document.getElementById('toast');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const animal=()=>state.cattle.find(c=>c.id===state.selected)||state.cattle[0];const esc=x=>String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const now=()=>new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});const wellness=c=>Math.max(48,Math.min(96,Math.round(90-Math.max(0,c.temp-39.2)*18-(c.notes.some(n=>/eye|appetite/i.test(n.detail))?4:0))));const status=c=>c.temp>=40?'Urgent veterinary attention':c.temp>39.3?'Monitoring closely':'Looks stable';const image=c=>c.photo?`<img src="${c.photo}" alt="${esc(c.name)} health-check photo">`:'🐄';
    const nav=[['overview','▦','Overview'],['cattle','🐄','My cattle'],['history','◔','Health history'],['sensor','♨','Sensor readings'],['diet','🥬','Diet & medication'],['vets','⚕','Find a vet']];
    function frame(content,title,subtitle,tools=''){app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">✚</div>HerdCare</div><div class="farm"><small>ACTIVE FARM</small><strong>Green Valley Dairy</strong></div><nav class="nav">${nav.map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="side-foot">${state.sensorOn?'● Connected sensor':'○ Sensor paused'}<br><strong>${state.sensorOn?'HC-TEMP-0192 · syncing':'Manual entry mode'}</strong></div></aside><main class="main"><header class="top"><div><div class="eyebrow">${page==='overview'?'Cattle health record':'HerdCare'}</div><h1>${title}</h1><p>${subtitle}</p></div>${tools}</header>${content}<p class="footer">HerdCare supports monitoring and recordkeeping. It does not diagnose disease; use a qualified veterinarian for medical decisions.</p></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
    function vetRow(v){return `<div class="vet"><div class="vet-avatar">${v.emoji}</div><div><strong>${esc(v.name)} <span style="color:#b87017">• ${esc(v.distance)}</span></strong><small>${esc(v.clinic)} · ${esc(v.open)}</small></div><div class="vet-actions"><a class="round" href="tel:${esc(v.phone)}" title="Call ${esc(v.name)}">☎</a><a class="round alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.address)}" title="Directions">↗</a></div></div>`}
    function overview(){const c=animal(),score=wellness(c),warning=c.temp>39.3;const alert=`<div class="alerts"><div class="alert"><div class="alert-icon">!</div><div><strong>${warning?'Check appetite and eye area':'Continue routine monitoring'}</strong><p>${warning?'Record any reduced eating, discharge, swelling, or unusual behaviour.':'Bella’s readings are currently close to her usual range.'}</p></div></div>${c.temp>=40?'<div class="alert urgent"><div class="alert-icon">!</div><div><strong>Contact a veterinarian now</strong><p>The recorded temperature is at or above the urgent threshold.</p></div></div>':''}</div>`;const html=`${warning?`<div class="notice"><div class="notice-dot"></div><div><strong>Temperature needs attention.</strong> ${esc(c.name)}’s latest reading is above the usual range. ${c.temp>=40?'Contact a veterinarian promptly.':'Monitor closely and seek veterinary advice if it persists.'}</div></div>`:''}<div class="dashboard"><div class="stack"><section class="card profile"><div class="profile-head"><div class="avatar">${image(c)}</div><div class="identity"><h2>${esc(c.name)}</h2><p>Tag ID: ${esc(c.id)} &nbsp;•&nbsp; ${esc(c.type)}</p><span class="tag">● ${status(c)}</span></div></div><div class="profile-bottom"><div class="score"><div class="score-ring" style="background:conic-gradient(var(--green) 0 ${score*3.6}deg,#e7ece7 ${score*3.6}deg)"><b>${score}%</b></div><div><strong>Estimated wellness</strong><small>Based on logged signals and records.</small></div></div><div class="details"><div><small>Breed</small><b>${esc(c.breed)}</b></div><div><small>Age</small><b>${esc(c.age)}</b></div><div><small>Weight</small><b>${esc(c.weight)}</b></div><div><small>Last calved</small><b>${esc(c.lastCalved)}</b></div></div></div></section><section class="card section"><div class="head"><h2>Body temperature</h2><button class="link" data-go="sensor">Sensor details</button></div><div class="temp"><div class="temp-main"><b>${c.temp.toFixed(1)}<span>°C</span></b><small>${c.temp>c.usual?'↑ '+(c.temp-c.usual).toFixed(1)+'°C over usual':'Within usual range'}</small></div><div class="trend"><svg viewBox="0 0 390 82" preserveAspectRatio="none"><path d="M0 62 C25 55,36 60,57 54 S89 68,112 56 S143 52,164 48 S193 54,216 43 S245 46,266 33 S294 42,315 26 S350 32,365 17 S380 22,390 12" fill="none" stroke="${warning?'#b87017':'#216b46'}" stroke-width="3"/><circle cx="390" cy="12" r="4" fill="${warning?'#b87017':'#216b46'}"/></svg><div class="trend-labels"><span>Aug 28</span><span>Aug 30</span><span>Sep 1</span><span>Today</span></div></div></div></section><section class="card section"><div class="head"><h2>Photo health check</h2><button class="link" data-action="photo">Upload photo</button></div><div class="photo-check"><div class="photo-preview">${image(c)}<small>${c.photo?'Latest photo · saved locally':'No photo uploaded'}</small></div><div class="checklist"><div class="check">Photo is stored in this animal’s record</div><div class="check">AI integration point ready for a vision service</div><div class="check warn">Demo observation: verify eye area in person</div><button class="link" data-action="note">Add observation →</button></div></div></section><section class="card section"><div class="head"><h2>Recent health record</h2><button class="link" data-go="history">View all history</button></div><div class="log">${c.notes.slice(0,3).map(n=>`<div class="log-row"><div class="date">${esc(n.date)}</div><div><strong>${esc(n.title)}</strong><p>${esc(n.detail)}</p></div><span class="mini">${esc(n.label)}</span></div>`).join('')}</div></section></div><div class="stack right"><section class="card section"><div class="head"><h2>Care actions</h2><button class="link" data-go="vets">Contact vet</button></div>${alert}</section><section class="card section"><div class="head"><h2>Today’s diet</h2><button class="link" data-go="diet">Edit plan</button></div><div class="diet-grid">${c.diet.map(d=>`<div class="diet-item"><small>${esc(d[0])}</small><b>${esc(d[1])}</b><br><span>${esc(d[2])}</span></div>`).join('')}</div></section><section class="card section"><div class="head"><h2>Medication & reminders</h2><button class="link" data-go="diet">Manage</button></div>${c.meds.map(m=>`<div class="med"><div class="med-icon">◒</div><div><strong>${esc(m.name)}</strong><small>${esc(m.detail)}</small></div><div class="due">${esc(m.due)}</div></div>`).join('')}</section><section class="card section vets-card"><div class="head"><h2>Nearby veterinarians</h2><button class="link" data-go="vets">View all</button></div><div class="map"><div class="road a"></div><div class="road b"></div><div class="road c"></div><div class="park"></div><div class="pin a"></div><div class="pin b"></div><div class="pin c"></div></div>${state.vets.slice(0,2).map(vetRow).join('')}</section></div></div>`;frame(html,'Good morning, Rohan',`Here’s ${c.name}’s current health picture.`,`<div class="tools"><button class="button ghost" data-action="note">+ Add health note</button><button class="button primary" data-action="photo">⌁ New photo check</button></div>`);bind()}
    function cattle(){const list=state.cattle.map(c=>`<article class="card animal-card" data-select="${esc(c.id)}"><div class="animal-top"><button type="button" class="tiny-avatar avatar-upload" data-photo-cattle="${esc(c.id)}" title="Add or change ${esc(c.name)}’s photo">${image(c)}<span class="photo-badge">⌁</span></button><div><h2>${esc(c.name)}</h2><p>${esc(c.id)} · ${esc(c.breed)}</p></div></div><div class="animal-stat"><span>Wellness <b>${wellness(c)}%</b></span><span>${c.temp.toFixed(1)}°C</span></div><button class="animal-delete" data-delete-cattle="${esc(c.id)}" type="button">Delete record</button></article>`).join('');frame(`<div class="cattle-grid">${list}<article class="card animal-card" data-action="add-cattle"><div class="animal-top"><div class="tiny-avatar" style="background:#eaf4eb;color:#216b46">＋</div><div><h2>Add cattle</h2><p>Create a new digital health record.</p></div></div></article></div>`,'My cattle','Select an animal to view its health record, or add a new one.');document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.select;save();page='overview';render()});document.querySelectorAll('[data-photo-cattle]').forEach(button=>button.onclick=e=>{e.stopPropagation();personalizeAnimalPhoto(button.dataset.photoCattle)});document.querySelectorAll('[data-delete-cattle]').forEach(button=>button.onclick=e=>{e.stopPropagation();const c=state.cattle.find(item=>item.id===button.dataset.deleteCattle);if(!c||!confirm(`Delete ${c.name}’s record from this device? This cannot be undone.`))return;state.cattle=state.cattle.filter(item=>item.id!==c.id);state.selected=state.cattle[0]?.id||'';save();page='cattle';render();toastMsg(`${c.name}’s record was deleted.`)});document.querySelector('[data-action="add-cattle"]').onclick=addCattle}
    function history(){const c=animal();frame(`<div class="two-col"><section class="card wide-card"><div class="head"><h2>${esc(c.name)}’s health history</h2><button class="button primary" data-action="note">+ New record</button></div>${c.notes.map(n=>`<div class="history-row"><div class="timeline-date">${esc(n.date)}</div><div><h3>${esc(n.title)}</h3><p>${esc(n.detail)}</p></div><span class="mini">${esc(n.label)}</span></div>`).join('')}</section><aside class="card info"><h2>What to log</h2><p>Use this record for temperature changes, appetite, water intake, behaviour, visible symptoms, treatments and veterinary visits.</p><p>Well-kept records help a veterinarian understand the animal’s history quickly.</p></aside></div>`,'Health history',`Every entry for ${c.name} is saved on this device.`);bind()}
    function sensor(){const c=animal();frame(`<div class="two-col"><section class="card wide-card"><div class="head"><h2>Temperature sensor</h2><span class="mini">${state.sensorOn?'LIVE':'PAUSED'}</span></div><div class="reading">${c.temp.toFixed(1)}<span>°C</span></div><div class="range">${c.name}’s usual baseline: ${c.usual.toFixed(1)}°C · Latest update: ${now()}</div><div class="trend" style="height:180px;margin-top:25px"><svg viewBox="0 0 790 150" preserveAspectRatio="none"><path d="M0 112 C60 103,80 112,130 98 S190 115,240 93 S310 96,365 81 S430 91,485 65 S555 78,605 48 S675 62,725 26 S760 36,790 18" fill="none" stroke="${c.temp>39.3?'#b87017':'#216b46'}" stroke-width="4"/><circle cx="790" cy="18" r="5" fill="${c.temp>39.3?'#b87017':'#216b46'}"/></svg><div class="trend-labels"><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span></div></div></section><aside class="card info"><h2>Update reading</h2><form class="form" id="temp-form"><label>Current body temperature (°C)<input name="temp" type="number" min="35" max="45" step="0.1" value="${c.temp.toFixed(1)}" required></label><button class="button primary" type="submit">Save temperature</button></form><div class="sensor-control" style="margin-top:16px"><button class="switch ${state.sensorOn?'on':''}" id="sensor-switch" aria-label="Toggle sensor"></button><div><b style="font-size:12px">Sensor connection</b><small style="display:block;color:var(--muted);font-size:10px">${state.sensorOn?'Connected and syncing':'Paused — manual entry mode'}</small></div></div><p class="small-note">A real installation will send readings from a temperature sensor through a secure device gateway.</p></aside></div>`,'Sensor readings',`Manage ${c.name}’s temperature monitoring and add an immediate reading.`);document.getElementById('temp-form').onsubmit=e=>{e.preventDefault();c.temp=Number(new FormData(e.target).get('temp'));c.notes.unshift({date:now(),title:'Temperature reading updated',detail:`Recorded body temperature: ${c.temp.toFixed(1)}°C.`,label:c.temp>39.3?'Monitor':'Normal'});save();toastMsg('Temperature saved to the health record.');render()};document.getElementById('sensor-switch').onclick=()=>{state.sensorOn=!state.sensorOn;save();render()}}
    function diet(){const c=animal();frame(`<div class="two-col"><section class="card wide-card"><div class="head"><h2>Diet plan</h2><button class="button primary" data-action="add-diet">+ Add diet item</button></div><div class="edit-list">${c.diet.map((d,i)=>`<div class="edit-row"><div><b>${esc(d[0])} — ${esc(d[1])}</b><small>${esc(d[2])}</small></div><button class="delete" data-remove-diet="${i}">Remove</button></div>`).join('')}</div></section><aside class="card info"><div class="head"><h2>Medication</h2><button class="link" data-action="add-med">+ Add</button></div><div class="edit-list">${c.meds.map((m,i)=>`<div class="edit-row"><div><b>${esc(m.name)}</b><small>${esc(m.detail)} · ${esc(m.due)}</small></div><button class="delete" data-remove-med="${i}">Remove</button></div>`).join('')}</div><p class="small-note">Only record medication prescribed or approved by a qualified veterinarian.</p></aside></div>`,'Diet & medication',`Manage ${c.name}’s daily feed plan and treatment reminders.`);document.querySelector('[data-action="add-diet"]').onclick=addDiet;document.querySelector('[data-action="add-med"]').onclick=addMed;document.querySelectorAll('[data-remove-diet]').forEach(b=>b.onclick=()=>{c.diet.splice(Number(b.dataset.removeDiet),1);save();render()});document.querySelectorAll('[data-remove-med]').forEach(b=>b.onclick=()=>{c.meds.splice(Number(b.dataset.removeMed),1);save();render()})}
    function vets(){frame(`<div class="two-col"><section class="directory">${state.vets.map(v=>`<article class="card directory-vet"><div class="vet-avatar">${v.emoji}</div><div><h2>${esc(v.name)} ${v.emergency?'<span class="emergency">· 24 HOUR</span>':''}</h2><p>${esc(v.clinic)} · ${esc(v.distance)}</p><p>${esc(v.address)} · ${esc(v.open)}</p></div><div class="vet-actions"><a class="round" href="tel:${esc(v.phone)}" title="Call ${esc(v.name)}">☎</a><a class="round alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.address)}" title="Open directions">↗</a></div></article>`).join('')}</section><aside class="card info"><h2>Find veterinary help</h2><p>Use the call button to contact a vet. The directions button opens the listed clinic location in Maps.</p><p>In a production system, clinic listings should be verified and kept up to date with vet consent.</p><button class="button ghost" data-action="add-vet">+ Add a local vet</button></aside></div>`,'Nearby veterinarians','Contact a local veterinary professional or get directions to their clinic.');document.querySelector('[data-action="add-vet"]').onclick=addVet}
    function render(){if(!state.cattle.length&&page!=='cattle')page='cattle';({overview,cattle,history,sensor,diet,vets}[page]||overview)()}
    function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-action="note"]').forEach(b=>b.onclick=addNote);document.querySelectorAll('[data-action="photo"]').forEach(b=>b.onclick=addPhoto)}
    function openModal(title,copy,fields,submit){document.getElementById('modal-title').textContent=title;document.getElementById('modal-copy').textContent=copy;const form=document.getElementById('modal-form');form.innerHTML=fields+`<div class="modal-actions"><button class="button ghost" type="button" id="close-modal">Cancel</button><button class="button primary" type="submit">Save</button></div>`;modal.classList.add('open');document.getElementById('close-modal').onclick=closeModal;form.onsubmit=e=>{e.preventDefault();submit(new FormData(form));closeModal()}}
    function closeModal(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)closeModal()}
    const careLanguage=()=>localStorage.getItem('herdcare-language-v1')||'en';const careCopy={en:{title:'Care review',intro:'AI-supported safety triage — not a diagnosis or prescription.',observed:'What was recorded',areas:'Potential concern areas — not diagnoses',next:'Recommended next step',medicine:'Medication safety',outlook:'What this review cannot determine',urgent:'Urgent: contact a qualified veterinarian now.',prompt:'Contact a qualified veterinarian today or as soon as possible.',monitor:'Continue close monitoring and contact a veterinarian if signs persist, worsen, or new signs appear.',medication:'Do not start, stop, or change any medication or dose from this review. Use only a veterinarian-approved plan and observe any milk or meat withdrawal instructions.',prognosis:'A note or photo cannot determine the disease, curability, or prognosis. A veterinarian needs the animal’s history and an in-person examination.',photo:'A photo was saved for the animal record. Images can document visible changes, but they cannot safely confirm a disease.',done:'Done',breathing:'Breathing or respiratory signs',appetite:'Appetite or water-intake changes',eye:'Eye, skin, discharge, or wound signs',digestive:'Digestive signs',mobility:'Mobility, swelling, or injury signs',general:'General health change'},hi:{title:'देखभाल समीक्षा',intro:'AI-सहायता प्राप्त सुरक्षा समीक्षा — निदान या दवा सलाह नहीं।',observed:'क्या दर्ज किया गया',areas:'संभावित चिंता क्षेत्र — निदान नहीं',next:'सुझाया गया अगला कदम',medicine:'दवा सुरक्षा',outlook:'यह समीक्षा क्या निर्धारित नहीं कर सकती',urgent:'तुरंत: अभी योग्य पशु चिकित्सक से संपर्क करें।',prompt:'आज या जल्द से जल्द योग्य पशु चिकित्सक से संपर्क करें।',monitor:'करीबी निगरानी जारी रखें और लक्षण बने रहने, बिगड़ने या नए लक्षण आने पर पशु चिकित्सक से संपर्क करें।',medication:'इस समीक्षा के आधार पर कोई दवा या खुराक शुरू, बंद या न बदलें। केवल पशु चिकित्सक द्वारा स्वीकृत योजना का उपयोग करें और दूध/मांस वापसी निर्देशों का पालन करें।',prognosis:'एक नोट या फो आत्ताच पात्र पशुवैद्याशी संपर्क करा।',prompt:'आज किंवा शक्य तितक्या लवकर पात्र पशुवैद्याशी संपर्क करा।',monitor:'काळजीपूर्वक निरीक्षण सुरू ठेवा; लक्षणे टिकल्यास, वाढल्यास किंवा नवीन लक्षणे आल्यास पशुवैद्याशी संपर्क करा।',medication:'या आढाव्याच्या आधारे औषध किंवा मात्रा सुरू, बंद किंवा बदलू नका। फक्त पशुवैद्याने मान्य केलेली योजना वापरा आणि दूध/मांस वापसी सूचना पाळा।',prognosis:'एक नोंद किंवा फोटो आजार, बरा होण्याची शक्यता किंवा परिणाम ठरवू शकत नाही। पशुवैद्याला इतिहास आणि प्रत्यक्ष तपासणी आवश्यक असते।',photo:'जनावराच्या नोंदीत फोटो जतन केला आहे। फोटो दृश्यमान बदल नोंदवू शकतात, पण आजाराची सुरक्षितपणे पुष्टी करू शकत नाहीत।',done:'पूर्ण',breathing:'श्वास किंवा श्वसनाची लक्षणे',appetite:'भूक किंवा पाणी पिण्यात बदल',eye:'डोळे, त्वचा, स्त्राव किंवा जखमेची लक्षणे',digestive:'पचनाची लक्षणे',mobility:'हालचाल, सूज किंवा दुखापतीची लक्षणे',general:'सामान्य आरोग्यात बदल'}};const careText=()=>careCopy[careLanguage()]||careCopy.en;
    function reviewObservation(detail,temp,photo){const c=careText(),q=String(detail||'').toLowerCase(),concerns=[];if(/cough|breath|wheez|nasal|respirat|सांस|श्वास|কাশি|শ্বাস/.test(q))concerns.push(c.breathing);if(/eat|appetite|water|drink|feed|भूख|पानी|चारा|ক্ষুধা|পানি|খাদ্য/.test(q))concerns.push(c.appetite);if(/eye|skin|discharge|wound|injur|आँख|आंख|त्वचा|घाव|চোখ|ত্বক|ক্ষত/.test(q))concerns.push(c.eye);if(/diarr|manure|stool|bloat|digest|दस्त|गोबर|पाचन|ডায়র|হজম/.test(q))concerns.push(c.digestive);if(/limp|lameness|swelling|leg|walk|लंगड़|सूजन|चलने|খোঁড়|ফোলা/.test(q))concerns.push(c.mobility);if(!concerns.length)concerns.push(c.general);const urgent=/collapse|unconscious|severe bleed|heavy bleed|cannot stand|not drink|difficult calv|collapse|बेहोश|गिर|बहुत खून|कठिन प्रसव|অজ্ঞান|পড়ে|রক্তপাত|কঠিন প্রসব/.test(q)||Number(temp)>=40;const prompt=!urgent&&(/fever|temperature|eye|discharge|swelling|limp|diarr|wound|off feed|appetite|बुखार|तापमान|आँख|सूजन|दस्त|ज्वर|জ্বর|তাপমাত্রা|চোখ|ফোলা|ডায়র/.test(q)||Number(temp)>39.3);return{level:urgent?'urgent':prompt?'prompt':'monitor',concerns,photo,detail:detail||'',copy:c}}
    function showCareReview(review){const c=review.copy,color=review.level==='urgent'?'#b74440':review.level==='prompt'?'#b87017':'#216b46',action=c[review.level];const recorded=review.detail?esc(review.detail):c.photo;openModal(c.title,c.intro,`<div style="display:grid;gap:12px;font-size:12px"><div style="padding:11px;border-left:4px solid ${color};border-radius:8px;background:#f6faf6"><strong>${esc(c.next)}</strong><br>${esc(action)}</div><div><strong>${esc(c.observed)}</strong><p style="margin:4px 0 0;color:#68766c">${recorded}</p></div><div><strong>${esc(c.areas)}</strong><p style="margin:4px 0 0;color:#68766c">${review.concerns.map(esc).join(' · ')}</p></div><div style="padding:11px;border-left:4px solid #b87017;border-radius:8px;background:#fff4df"><strong>${esc(c.medicine)}</strong><br>${esc(c.medication)}</div><div style="padding:11px;border-left:4px solid #216b46;border-radius:8px;background:#eff8ef"><strong>${esc(c.outlook)}</strong><br>${esc(c.prognosis)}</div></div>`,()=>{});document.querySelector('#modal-form .button.primary').textContent=c.done}
    function addNote(){openModal('Add health record','Save an observation, symptom or treatment note to this animal’s history.',`<label>Entry type<select name="type"><option>General observation</option><option>Appetite and activity</option><option>Veterinary visit</option><option>Medication update</option></select></label><label>Details<textarea name="detail" placeholder="Example: Appetite lower than usual this afternoon." required></textarea></label><label>Temperature (optional, °C)<input name="temp" type="number" min="35" max="45" step="0.1" placeholder="39.6"></label>`,d=>{const c=animal(),t=d.get('temp'),detail=d.get('detail');if(t)c.temp=Number(t);c.notes.unshift({date:now(),title:d.get('type'),detail,label:t&&Number(t)>39.3?'Monitor':'Saved'});const review=reviewObservation(detail,t||c.temp,false);c.lastCareReview={at:now(),level:review.level,concerns:review.concerns};save();render();toastMsg('Health record saved.');showCareReview(review)})}
    function addPhoto(){const c=animal();openModal('Add photo health check','Choose a clear photo. It is saved only in this browser for this prototype.',`<label>Photo<input type="file" name="photo" accept="image/*" required></label><label>Optional note<textarea name="detail" placeholder="Example: Checked eyes and coat after morning feeding."></textarea></label>`,d=>{const file=d.get('photo');if(!file||!file.size)return;const r=new FileReader();r.onload=()=>{const detail=d.get('detail');c.photo=r.result;c.notes.unshift({date:now(),title:'Photo health check added',detail:detail||'Photo added to the local health record. A veterinary review can be requested for visible changes.',label:'Photo'});const review=reviewObservation(detail,c.temp,true);c.lastCareReview={at:now(),level:review.level,concerns:review.concerns};save();render();toastMsg('Photo saved to the health record.');showCareReview(review)};r.readAsDataURL(file)})}
    function personalizeAnimalPhoto(id){const c=state.cattle.find(item=>item.id===id);if(!c)return;openModal('Personalize animal photo','Add a profile photo for this animal. It is stored only in this browser for the prototype.',`<label>Photo<input type="file" name="photo" accept="image/*" required></label>`,d=>{const file=d.get('photo');if(!file||!file.size)return;const r=new FileReader();r.onload=()=>{c.photo=r.result;save();render();toastMsg(`${c.name}’s profile photo was updated.`)};r.readAsDataURL(file)})}
    function addCattle(){openModal('Add cattle record','Create a basic profile to start recording health details.',`<label>Name<input name="name" required placeholder="e.g. Daisy"></label><label>Tag ID<input name="id" required placeholder="e.g. GV-043"></label><label>Breed<input name="breed" required placeholder="e.g. Jersey"></label><label>Age<input name="age" required placeholder="e.g. 3 years"></label>`,d=>{const id=d.get('id').trim();if(state.cattle.some(c=>c.id===id)){toastMsg('That tag ID already exists.');return}state.cattle.push({id,name:d.get('name').trim(),type:'Dairy cow',breed:d.get('breed').trim()||'Not recorded',age:d.get('age').trim()||'Not recorded',weight:'Not recorded',lastCalved:'Not recorded',temp:38.8,usual:38.8,photo:'',notes:[],diet:JSON.parse(JSON.stringify(demo.cattle[0].diet)),meds:[]});state.selected=id;save();page='overview';render();toastMsg('New cattle record created.')})}
    function addDiet(){openModal('Add diet item','Add a feed, water, or supplement target.',`<label>Item name<input name="name" required placeholder="e.g. Evening feed"></label><label>Amount<input name="amount" required placeholder="e.g. 12 kg"></label><label>Description<input name="detail" required placeholder="e.g. Dry fodder"></label>`,d=>{animal().diet.push([d.get('name'),d.get('amount'),d.get('detail')]);save();render();toastMsg('Diet item added.')})}
    function addMed(){openModal('Add medication reminder','Keep dosage and scheduling details in the health record.',`<label>Medicine name<input name="name" required></label><label>Dosage / instruction<input name="detail" required placeholder="e.g. 60 g with evening feed"></label><label>Due date or timing<input name="due" required placeholder="e.g. Today"></label>`,d=>{animal().meds.push({name:d.get('name'),detail:d.get('detail'),due:d.get('due')});save();render();toastMsg('Medication reminder added.')})}
    function addVet(){openModal('Add local veterinarian','Save a verified local contact for this prototype.',`<label>Veterinarian name<input name="name" required></label><label>Clinic<input name="clinic" required></label><label>Phone number<input name="phone" type="tel" required></label><label>Clinic address<input name="address" required></label><label>Distance (optional)<input name="distance" placeholder="e.g. 2.5 km"></label>`,d=>{state.vets.push({name:d.get('name'),clinic:d.get('clinic'),address:d.get('address'),phone:d.get('phone'),distance:d.get('distance')||'Local',open:'Hours not recorded',emoji:'👩🏽‍⚕️',emergency:false});save();render();toastMsg('Veterinarian contact added.')})}
    let toastTimer;function toastMsg(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2800)}render();
  })();
  </script>
  <script>
    /* Key-free Google Maps embeds for the nearby-vet panels. */
    (()=>{
      const mapUrl=place=>'https://www.google.com/maps?q='+encodeURIComponent(place)+'&output=embed';
      const makeMap=(place,label)=>{
        const map=document.createElement('div');
        map.className='map';
        const frame=document.createElement('iframe');
        frame.src=mapUrl(place);frame.title=label;frame.loading='lazy';frame.referrerPolicy='no-referrer-when-downgrade';
        map.append(frame);return map;
      };
      const upgradeMaps=()=>{
        document.querySelectorAll('.vets-card .map:not([data-live-map])').forEach(map=>{
          map.dataset.liveMap='true';
          map.replaceChildren(makeMap('Green Cross Veterinary Clinic, Green Valley','Nearest veterinary clinic map').firstChild);
        });
        const heading=[...document.querySelectorAll('h1')].find(h=>h.textContent.trim()==='Nearby veterinarians');
        if(!heading)return;
        const info=heading.closest('main')?.querySelector('.info');
        if(!info||info.querySelector('[data-vet-directory-map]'))return;
        const firstAddress=document.querySelector('.directory-vet p:nth-of-type(2)')?.textContent.split(' · ')[0]||'Veterinary clinics near Green Valley';
        const map=makeMap(firstAddress,'Veterinary clinic map');
        map.dataset.vetDirectoryMap='true';
        const caption=document.createElement('p');caption.className='map-caption';caption.textContent='Map centred on the nearest listed clinic. Use ↗ for turn-by-turn directions.';
        info.prepend(caption);info.prepend(map);
      };
      new MutationObserver(upgradeMaps).observe(document.getElementById('app'),{childList:true,subtree:true});
      upgradeMaps();
    })();
  </script>
  <script>
    /* GPS tracker and geofence prototype. A hardware gateway can call HerdCareGPS.ingest(). */
    (()=>{
      const GPS_KEY='herdcare-gps-geofence-v1';
      const defaults={animalId:'GV-042',radius:250,current:{x:60,y:46},previous:{x:53,y:49},updated:'Just now',connected:true,wasOutside:false};
      let gps;try{gps={...defaults,...JSON.parse(localStorage.getItem(GPS_KEY))}}catch{gps={...defaults}};
      const persist=()=>localStorage.setItem(GPS_KEY,JSON.stringify(gps));
      const herd=()=>{try{return JSON.parse(localStorage.getItem('herdcare-working-prototype-v1'))?.cattle||[{id:'GV-042',name:'Bella'}]}catch{return[{id:'GV-042',name:'Bella'}]}};
      const tracked=()=>herd().find(a=>a.id===gps.animalId)||herd()[0]||{id:'GV-042',name:'Bella'};
      const distance=()=>Math.round(Math.hypot(gps.current.x-50,gps.current.y-50)*10);
      const outside=()=>distance()>gps.radius;
      const toast=message=>{const box=document.getElementById('toast');if(!box)return;box.textContent=message;box.classList.add('show');clearTimeout(window.herdcareGpsToast);window.herdcareGpsToast=setTimeout(()=>box.classList.remove('show'),5000)};
      const checkGeofence=()=>{const escaped=outside();if(escaped&&!gps.wasOutside)toast(`⚠ GPS alert: ${tracked().name} has left the ${gps.radius} m farm boundary.`);if(!escaped&&gps.wasOutside)toast(`✓ GPS update: ${tracked().name} is back inside the farm boundary.`);gps.wasOutside=escaped;persist()};
      const styles=document.createElement('style');styles.textContent=`
        .gps-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(285px,.75fr);gap:20px}.gps-map-card{padding:19px}.gps-map{height:390px;position:relative;overflow:hidden;border:1px solid #c9ddcb;border-radius:12px;background:linear-gradient(135deg,#deeed8 0 22%,#c4dfb6 22% 24%,#e7efd7 24% 48%,#cbe3cc 48% 51%,#e5f0e2 51%);isolation:isolate}.gps-map:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(35deg,transparent 0 54px,#ffffff8a 55px 61px,transparent 62px 112px);opacity:.8}.gps-map:after{content:'N';position:absolute;z-index:4;right:15px;top:12px;width:25px;height:25px;border-radius:50%;background:#fff;color:var(--forest);display:grid;place-items:center;font-size:11px;font-weight:900;box-shadow:0 2px 7px #173d2a22}.farm-boundary{position:absolute;z-index:1;left:50%;top:50%;translate:-50% -50%;width:var(--boundary);aspect-ratio:1;border:3px dashed var(--green);border-radius:50%;background:#b7df7530;box-shadow:0 0 0 5px #ffffff4f}.farm-label{position:absolute;z-index:2;left:50%;top:50%;translate:-50% -50%;padding:5px 9px;border-radius:99px;background:#fff;color:var(--forest);font-size:10px;font-weight:850;white-space:nowrap;box-shadow:0 2px 7px #173d2a18}.gps-route{position:absolute;z-index:2;inset:0;width:100%;height:100%;overflow:visible}.gps-route path{stroke:#b87017;stroke-width:3;stroke-dasharray:7 5;fill:none;marker-end:url(#route-arrow)}.gps-marker{position:absolute;z-index:3;left:var(--animal-x);top:var(--animal-y);translate:-50% -50%;width:37px;height:37px;border:3px solid #fff;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 4px 12px #7f282855}.gps-marker.safe{background:var(--green)}.gps-marker:after{content:'';position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid currentColor;opacity:.32;animation:gps-pulse 1.8s infinite}.gps-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--muted)}.gps-legend span:before{content:'';display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;background:var(--green)}.gps-legend span:nth-child(2):before{background:var(--red)}.gps-legend span:nth-child(3):before{background:#b87017}@keyframes gps-pulse{0%,100%{scale:.65;opacity:.42}50%{scale:1;opacity:0}}.gps-metric{display:grid;gap:4px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.gps-metric b{font-size:21px;letter-spacing:-.6px}.gps-metric small{color:var(--muted);font-size:10px}.gps-alert{border-left:4px solid var(--red);background:var(--red-bg);padding:12px;border-radius:9px;color:#7b2c28;font-size:12px}.gps-safe{border-left:4px solid var(--green);background:var(--pale);padding:12px;border-radius:9px;color:var(--forest);font-size:12px}.gps-controls{display:grid;gap:12px}.gps-controls input[type=range]{width:100%;accent-color:var(--green)}.gps-buttons{display:flex;gap:8px;flex-wrap:wrap}.gps-buttons .button{font-size:12px;padding:8px 10px}.gps-route-note{margin:0;color:var(--muted);font-size:12px}@media(max-width:800px){.gps-layout{grid-template-columns:1fr}.gps-map{height:320px}}
      `;document.head.append(styles);
      const addNav=()=>{const nav=document.querySelector('.nav');if(!nav||nav.querySelector('[data-gps-page]'))return;const button=document.createElement('button');button.dataset.gpsPage='true';button.innerHTML='<span>◉</span>GPS tracker';button.onclick=showGps;nav.append(button)};
      const mapHtml=()=>{const animal=tracked(),isOut=outside(),size=Math.max(28,Math.min(84,gps.radius/6));return `<div class="gps-map" style="--boundary:${size}%;--animal-x:${gps.current.x}%;--animal-y:${gps.current.y}%"><div class="farm-boundary"></div><div class="farm-label">Green Valley Farm · ${gps.radius} m</div><svg class="gps-route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Recent route"><defs><marker id="route-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b87017"/></marker></defs><path d="M${gps.previous.x},${gps.previous.y} L${(gps.previous.x+gps.current.x)/2},${(gps.previous.y+gps.current.y)/2} L${gps.current.x},${gps.current.y}"/></svg><div class="gps-marker ${isOut?'':'safe'}" title="${animal.name}'s current GPS location">🐄</div></div>`};
      function showGps(){
        const main=document.querySelector('#app main');if(!main)return;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',!!b.dataset.gpsPage));
        const animal=tracked(),isOut=outside(),metres=distance(),animals=herd();
        main.innerHTML=`<header class="top"><div><div class="eyebrow">Live location & safety</div><h1>GPS tracker</h1><p>Track cattle inside the designated Green Valley Farm boundary.</p></div><div class="tools"><span class="mini">${gps.connected?'● TRACKER CONNECTED':'○ TRACKER OFFLINE'}</span></div></header><div class="gps-layout"><section class="card gps-map-card"><div class="head"><h2>${animal.name}'s current route</h2><span class="mini">Updated ${gps.updated}</span></div>${mapHtml()}<div class="gps-legend"><span>Farm boundary</span><span>${isOut?'Outside boundary':'Current location'}</span><span>Recent travel direction</span></div></section><aside class="stack"><section class="card section"><div class="head"><h2>Geofence status</h2><span class="mini" style="${isOut?'background:#fff0ef;color:#b74440':''}">${isOut?'ALERT':'SAFE'}</span></div><div class="${isOut?'gps-alert':'gps-safe'}"><strong>${isOut?`${animal.name} has left the farm boundary.`:`${animal.name} is within the designated farm area.`}</strong><br>${isOut?`${metres} m from the farm centre — ${metres-gps.radius} m past the boundary.`:`${metres} m from the farm centre.`}</div><div class="gps-controls" style="margin-top:15px"><label class="form">Tracked animal<select id="gps-animal">${animals.map(a=>`<option value="${a.id}" ${a.id===animal.id?'selected':''}>${a.name} · ${a.id}</option>`).join('')}</select></label><label class="form">Farm boundary radius: <b id="radius-value">${gps.radius} m</b><input id="gps-radius" type="range" min="100" max="500" step="25" value="${gps.radius}"></label></div></section><section class="card section"><div class="head"><h2>Movement insight</h2></div><p class="gps-route-note"><strong>${isOut?'Heading north-east toward Market Road.':'Moving north-east within the grazing area.'}</strong><br>Route arrow shows the last two tracker pings. A boundary alert is generated the moment the tracker crosses the farm radius.</p><div class="gps-buttons" style="margin-top:14px"><button class="button primary" id="gps-exit">Simulate boundary exit</button><button class="button ghost" id="gps-return">Return to farm</button></div></section></aside></div><p class="footer">GPS positions are shown from the animal’s attached tracker. In production, use a secure tracker gateway and verified farm coordinates.</p>`;
        document.getElementById('gps-animal').onchange=e=>{gps.animalId=e.target.value;persist();showGps()};
        document.getElementById('gps-radius').oninput=e=>{gps.radius=Number(e.target.value);document.getElementById('radius-value').textContent=`${gps.radius} m`;checkGeofence();showGps()};
        document.getElementById('gps-exit').onclick=()=>ingest({x:84,y:30,updated:'Just now'});
        document.getElementById('gps-return').onclick=()=>ingest({x:60,y:46,updated:'Just now'});
      }
      function ingest(update){gps.previous={...gps.current};gps.current={x:Number(update.x),y:Number(update.y)};gps.updated=update.updated||new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});checkGeofence();if(document.querySelector('[data-gps-page].active'))showGps()}
      window.HerdCareGPS={ingest};
      new MutationObserver(addNav).observe(document.getElementById('app'),{childList:true,subtree:true});addNav();checkGeofence();
    })();

      let config={model:'gemini-2.5-flash',endpoint:'',apiKey:''};

{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:#fff}.aashu-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:12px}.aashu-send{border:0;border-radius:9px;background:var(--green);color:#fff;padding:0 12px;font-weight:800;cursor:pointer}@media(max-width:540px){.aashu-fab{bottom:15px;left:15px}.aashu-chat{left:15px;bottom:82px}}

      const fab=document.createElement('button');fab.className='aashu-fab';fab.title='Ask Aashu';fab.setAttribute('aria-label','Open Aashu animal-care assistant');fab.textContent='✦';document.body.append(shell,fab);

        if(config.apiKey){const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(config.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':config.apiKey},body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM()}]},contents})});if(!response.ok)throw new Error('Gemini request unavailable');const data=await response.json();return data.candidates?.[0]?.content?.parts?.map(part=>part.text||'').join('')||text('offline')}

      const renderResults=()=>{const query=document.getElementById('animal-search')?.value.toLowerCase().trim()||'';const category=document.getElementById('animal-category')?.value||'All';const found=profiles.filter(item=>(category==='All'||item.animal===category)&&`${item.animal} ${item.breed} ${item.type} ${item.about}`.toLowerCase().includes(query));const grid=document.getElementById('breed-results');if(!grid)return;grid.innerHTML=found.length?found.map(card).join(''):`<div class="card library-empty">No built-in profile found. Try the open-knowledge search below.</div>`;grid.querySelectorAll('[data-ask-breed]').forEach(button=>button.onclick=()=>window.HerdCareAashu?.ask(`What should I monitor for a ${button.dataset.askBreed}? Please include diet, behaviour, and preventive-care questions to discuss with a veterinarian.`))};
      const searchOpenKnowledge=async()=>{const query=document.getElementById('animal-search').value.trim();const box=document.getElementById('open-knowledge');if(!query){box.innerHTML='<p class="library-footer-note">Type an animal or breed name to search the open-knowledge database.</p>';return}box.innerHTML='<p class="library-footer-note">Searching the open-knowledge database…</p>';try{const search=await fetch(`https://en.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(query)}&limit=1`);const data=await search.json();const result=data.pages?.[0];if(!result)throw new Error('No result');const title=result.title.replace(/ /g,'_');const summaryResponse=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);const summary=await summaryResponse.json();box.innerHTML=`<article class="card open-result"><span class="breed-kind">Open knowledge result</span><h2>${safe(summary.title||result.title)}</h2><p>${safe(summary.extract||result.description||'No summary available.')}</p><a class="link" target="_blank" rel="noopener" href="${safe(summary.content_urls?.desktop?.page||'https://en.wikipedia.org/wiki/'+encodeURIComponent(title))}">Read the source article ↗</a></article>`}catch{box.innerHTML='<p class="library-footer-note">The online source could not be reached. The built-in breed profiles remain available offline.</p>'}};
      function showLibrary(){const main=document.querySelector('#app main');if(!main)return;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',!!button.dataset.libraryPage));main.innerHTML=`<header class="top"><div><div class="eyebrow">Open animal knowledge</div><h1>Animal & breed library</h1><p>Search practical starter profiles for cattle, dogs, goats, and their breeds.</p></div></header><div class="library-intro"><span style="font-size:19px">◌</span><div><b>Breed profiles for everyday reference</b>Diet and lifespan guidance is general education. Individual feeding, medication, vaccination, and health decisions should be confirmed with a qualified veterinarian or animal nutritionist.</div></div><div class="library-tools"><div class="library-search"><input id="animal-search" autocomplete="off" placeholder="Search an animal or breed — e.g. Sahiwal, dog, Golden Retriever"><button id="open-search">Search open knowledge</button></div><select id="animal-category" class="library-filter" aria-label="Animal category"><option>All</option><option>Cattle</option><option>Dog</option><option>Goat</option></select></div><section class="library-grid" id="breed-results"></section><section id="open-knowledge" class="open-knowledge"></section><p class="library-footer-note">Online lookups use Wikimedia’s open knowledge content. Review the linked source and consult local professionals for animal-specific care.</p>`;document.getElementById('animal-search').oninput=renderResults;document.getElementById('animal-category').onchange=renderResults;document.getElementById('open-search').onclick=searchOpenKnowledge;renderResults()}
      new MutationObserver(addNav).observe(document.getElementById('app'),{childList:true,subtree:true});addNav();

  <script>
    /* Vet Portal: local prototype database, registration, search, and directory enrichment. */
    (()=>{
      const VET_KEY='herdcare-vet-profiles-v1';

      const load=()=>{try{return JSON.parse(localStorage.getItem(VET_KEY))||[]}catch{return[]}};
      const save=profiles=>localStorage.setItem(VET_KEY,JSON.stringify(profiles));
      const baseDirectory=()=>{const starter=[{name:'Dr. Ananya Sharma',clinic:'Green Cross Veterinary Clinic',address:'12 Farm Road, Green Valley',phone:'+919800123456',open:'Open now'},{name:'Dr. Vikram Rao',clinic:'District Animal Hospital',address:'Market Road, Green Valley',phone:'+919800789012',open:'24-hour service'},{name:'Dr. Meera Patel',clinic:'Rural Livestock Care',address:'Highway 7, Green Valley',phone:'+919800456789',open:'Open until 20:00'}];try{return (JSON.parse(localStorage.getItem('herdcare-working-prototype-v1'))?.vets||starter).map(v=>({id:`base-${v.phone}`,name:v.name,clinic:v.clinic,address:v.address,phone:v.phone,specialty:'Livestock & general veterinary care',availability:v.open,registration:'Directory listing',verified:true}))}catch{return starter.map(v=>({id:`base-${v.phone}`,...v,specialty:'Livestock & general veterinary care',availability:v.open,registration:'Directory listing',verified:true}))}};

      const style=document.createElement('style');style.textContent=`
        .vet-portal{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.35fr);gap:20px}.vet-registration{padding:19px}.vet-registration h2{margin:0 0 4px;font-size:17px}.vet-registration>p{margin:0 0 15px;color:var(--muted);font-size:12px}.vet-register-form{display:grid;gap:10px}.vet-register-form label{font-size:11px;font-weight:800}.vet-register-form input,.vet-register-form textarea,.vet-register-form select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.vet-register-form textarea{min-height:62px;resize:vertical}.vet-db-note{margin-top:13px;padding:10px;border-left:3px solid var(--amber);border-radius:7px;background:var(--amber-bg);color:#70460d;font-size:10px}.vet-directory-panel{display:grid;gap:11px}.vet-directory-tools{display:flex;gap:9px}.vet-directory-tools input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:12px}.vet-profile-card{padding:15px;display:grid;grid-template-columns:43px 1fr auto;gap:10px;align-items:start}.vet-profile-card h2{margin:0;font-size:14px}.vet-profile-card p{margin:3px 0;color:var(--muted);font-size:11px}.vet-profile-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#d6ebd8;font-size:21px}.vet-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.vet-badge{padding:3px 6px;border-radius:99px;background:var(--pale);color:var(--green);font-size:9px;font-weight:850}.vet-badge.pending{background:var(--amber-bg);color:var(--amber)}.vet-profile-actions{display:flex;gap:5px}.vet-profile-actions a{display:grid;place-items:center;width:29px;height:29px;border-radius:7px;background:#eaf4eb;color:var(--green);font-size:13px;text-decoration:none}.vet-empty{padding:21px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:850px){.vet-portal{grid-template-columns:1fr}.vet-profile-card{grid-template-columns:43px 1fr}.vet-profile-actions{grid-column:2}}
      `;document.head.append(style);
      const profileCard=profile=>`<article class="card vet-profile-card"><div class="vet-profile-avatar">⚕</div><div><h2>${safe(profile.name)}</h2><p><strong>${safe(profile.clinic)}</strong> · ${safe(profile.specialty)}</p><p>${safe(profile.address)} · ${safe(profile.availability)}</p><div class="vet-badges"><span class="vet-badge ${profile.verified?'':'pending'}">${profile.verified?'Verified directory listing':'Profile pending verification'}</span><span class="vet-badge">Reg. ${safe(profile.registration)}</span></div></div><div class="vet-profile-actions"><a href="tel:${safe(profile.phone)}" title="Call ${safe(profile.name)}">☎</a><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(profile.address)}" title="Directions">↗</a></div></article>`;
      const renderDirectory=()=>{const list=document.getElementById('vet-profile-list');if(!list)return;const query=document.getElementById('vet-directory-search')?.value.toLowerCase().trim()||'';const results=directory().filter(profile=>`${profile.name} ${profile.clinic} ${profile.specialty} ${profile.address}`.toLowerCase().includes(query));list.innerHTML=results.length?results.map(profileCard).join(''):'<div class="card vet-empty">No veterinarian profiles match this search.</div>'};
      function showPortal(){const main=document.querySelector('#app main');if(!main)return;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',!!button.dataset.vetPortal));main.innerHTML=`<header class="top"><div><div class="eyebrow">Professional directory</div><h1>Vet Portal</h1><p>Register a professional profile so local animal owners can find and contact you.</p></div></header><div class="vet-portal"><section class="card vet-registration"><h2>Create your vet profile</h2><p>Share professional details, practice location, and availability.</p><form class="vet-register-form" id="vet-registration-form"><label>Full name<input name="name" required placeholder="e.g. Dr. Priya Shah"></label><label>Clinic or practice<input name="clinic" required placeholder="e.g. Valley Animal Care"></label><label>Veterinary registration number<input name="registration" required placeholder="e.g. VCI/State registration no."></label><label>Specialty<input name="specialty" required placeholder="e.g. Cattle health, surgery, poultry"></label><label>Phone number<input name="phone" type="tel" required placeholder="Contact number"></label><label>Practice address<textarea name="address" required placeholder="Clinic address"></textarea></label><label>Availability<select name="availability"><option>Open now — hours to be confirmed</option><option>Weekdays</option><option>24-hour emergency service</option><option>By appointment</option></select></label><button class="button primary" type="submit">Create vet profile</button></form><div class="vet-db-note"><strong>Prototype database:</strong> profiles are stored on this browser. A production launch should validate registration numbers and save profiles through a secure server before public verification.</div></section><section class="vet-directory-panel"><div class="head"><h2>Veterinarian directory</h2><span class="mini">${directory().length} profiles</span></div><div class="vet-directory-tools"><input id="vet-directory-search" autocomplete="off" placeholder="Search name, clinic, specialty, or area"></div><div id="vet-profile-list" class="directory"></div></section></div><p class="footer">Directory information is for contact and discovery. Confirm professional credentials and clinical availability before making care decisions.</p>`;document.getElementById('vet-directory-search').oninput=renderDirectory;document.getElementById('vet-registration-form').onsubmit=event=>{event.preventDefault();const data=new FormData(event.currentTarget);const profiles=load();profiles.unshift({id:`vet-${Date.now()}`,name:data.get('name').trim(),clinic:data.get('clinic').trim(),registration:data.get('registration').trim(),specialty:data.get('specialty').trim(),phone:data.get('phone').trim(),address:data.get('address').trim(),availability:data.get('availability'),verified:false});save(profiles);toast('Vet profile saved to this device and added to the directory.');showPortal()};renderDirectory()}
      const addNav=()=>{const nav=document.querySelector('.nav');if(!nav||nav.querySelector('[data-vet-portal]'))return;const button=document.createElement('button');button.dataset.vetPortal='true';button.innerHTML='<span>⚕</span>Vet Portal';button.onclick=showPortal;nav.append(button)};
      const enrichExistingDirectory=()=>{const list=document.querySelector('.directory');if(!list||list.id==='vet-profile-list'||list.dataset.profileEnriched)return;const newProfiles=load();if(!newProfiles.length)return;list.dataset.profileEnriched='true';newProfiles.forEach(profile=>list.insertAdjacentHTML('beforeend',profileCard(profile)))};
      const update=()=>{addNav();enrichExistingDirectory()};new MutationObserver(update).observe(document.getElementById('app'),{childList:true,subtree:true});update();
    })();

  <script>
    /* Livestock product library: animal-husbandry outputs and waste-to-value guides. */
    (()=>{
      const products=[
        {id:'dairy',icon:'🥛',name:'Milk & dairy products',category:'Food',animals:'Dairy cattle · buffalo · goats',summary:'Turn clean, chilled milk into consumer-ready milk, curd, paneer, ghee, or cheese through hygienic, licensed processing.',steps:['Collect only clean milk from healthy animals and filter it using food-safe equipment.','Cool promptly and keep the cold chain intact until testing or processing.','Test and process through a licensed dairy facility; use validated pasteurisation and packaging controls.','Label, store, and distribute according to local food-safety rules.'],importance:'Value-added dairy products can reduce spoilage and diversify farm income.',considerations:'Food safety is critical. Follow local dairy licensing, hygiene, testing, and cold-chain requirements.'},
        {id:'eggs',icon:'🥚',name:'Table eggs',category:'Food',animals:'Laying hens · ducks · quail',summary:'Fresh eggs gathered, graded, packed, and sold using clean handling and appropriate storage.',steps:['Collect eggs frequently from clean nesting areas.','Remove visibly cracked or heavily soiled eggs from retail supply.','Grade and pack using clean, dry packaging.','Store and transport according to local egg-handling guidance.'],importance:'Egg production offers frequent, marketable outputs from well-managed poultry flocks.',considerations:'Keep housing clean and monitor flock health. Follow local rules for washing, labeling, and storage.'},
        {id:'wool',icon:'🧶',name:'Wool & fibre',category:'Materials',animals:'Sheep · fibre goats',summary:'Fleece is responsibly sheared, sorted, cleaned, and supplied to textile makers or local craft producers.',steps:['Plan shearing for suitable weather and animal comfort.','Use trained shearers and clean equipment to minimise stress and cuts.','Sort fleece by quality and remove contaminated material.','Store dry and send to an approved cleaning or processing partner.'],importance:'Fibre creates a renewable material stream and can add value beyond meat or milk.',considerations:'Animal welfare comes first. Keep animals protected from weather after shearing.'},
        {id:'compost',icon:'🌱',name:'Composted farm manure',category:'Farm input',animals:'Cattle · buffalo · goats · sheep · poultry',summary:'Manure and suitable bedding are composted into a stabilised soil amendment for fields and gardens.',steps:['Collect manure and bedding separately from plastics, medicines, and other contaminants.','Build managed compost piles with a balanced mix of moist nitrogen-rich and dry carbon-rich materials.','Turn and monitor piles using a locally appropriate compost plan.','Allow compost to mature fully before applying it to land.'],importance:'Composting returns nutrients and organic matter to soil while reducing unmanaged waste.',considerations:'Use protective equipment, manage runoff, and follow local nutrient-management rules. Do not apply unfinished compost to food crops.'},
        {id:'biogas',icon:'♨',name:'Biogas & digestate',category:'Energy',animals:'Cattle · buffalo · pigs · poultry',summary:'Organic manure can feed a purpose-built anaerobic digester that produces biogas and nutrient-rich digestate.',steps:['Have a qualified provider assess manure supply, water needs, site drainage, and local permissions.','Install an approved, sealed digester and gas-handling system.','Feed the system consistently with appropriate organic inputs and maintain it to specification.','Use biogas through approved equipment; handle digestate under a nutrient-management plan.'],importance:'A well-run system can convert waste into renewable energy and a useful fertiliser input.',considerations:'Gas systems present fire, asphyxiation, and pressure hazards. Use trained installers, ventilation, leak checks, and local regulatory approval.'},
        {id:'vermicompost',icon:'🪱',name:'Vermicompost',category:'Farm input',animals:'Cattle · goats · sheep · rabbits',summary:'Matured organic material is processed by compost worms into a fine, biologically active soil conditioner.',steps:['Pre-compost manure and bedding until it is cool and stabilised.','Prepare shaded beds with moisture and ventilation suitable for the worm species.','Add feedstock gradually and avoid chemicals, plastics, or fresh hot manure.','Harvest finished castings and screen or package them as appropriate.'],importance:'Vermicompost can create a compact, higher-value soil product from suitable farm organics.',considerations:'Maintain correct moisture and temperature. Use only mature inputs to protect the worm population.'},
        {id:'briquettes',icon:'🔥',name:'Dung fuel briquettes',category:'Energy',animals:'Cattle · buffalo',summary:'Clean, dried dung can be converted into fuel briquettes where permitted and where clean-burning alternatives are not available.',steps:['Collect dung from clean areas and separate non-organic contaminants.','Dry or process it using a controlled, hygienic method.','Form briquettes with appropriate equipment and dry fully before storage.','Store away from moisture and use only in suitable, ventilated appliances.'],importance:'Can provide a locally available fuel option and reduce loose-waste accumulation.',considerations:'Burning biomass creates smoke and air-pollution risks. Prioritise clean energy where available and always use adequate ventilation.'},
        {id:'litter',icon:'🌾',name:'Poultry-litter soil input',category:'Farm input',animals:'Chickens · turkeys · ducks',summary:'Managed poultry litter can be composted or treated under an approved nutrient plan for agricultural soil use.',steps:['Remove litter from houses using protective equipment.','Keep it covered and separated from watercourses and drainage paths.','Compost or treat it according to a nutrient-management plan.','Apply only at rates suitable for the crop and soil, with required setback distances.'],importance:'Properly managed litter can recycle valuable nutrients back into cropping systems.',considerations:'Pathogen, ammonia, and water-contamination risks require careful storage, treatment, and local compliance.'}
      ];

re{content:counter(step);position:absolute;left:11px;top:10px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--pale);color:var(--green);font-weight:850;font-size:11px}.product-callout{margin:15px 0;padding:12px;border-left:4px solid var(--green);border-radius:8px;background:#f3f9f3;font-size:12px;color:#365c3e}.product-safety{padding:12px;border-left:4px solid var(--amber);border-radius:8px;background:var(--amber-bg);font-size:12px;color:#714508}.product-detail-icon{font-size:41px;margin-bottom:5px}.back-link{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:850;padding:0;cursor:pointer}@media(max-width:800px){.product-guide{grid-template-columns:1fr}}

      function showGuide(id){const product=products.find(item=>item.id===id);const main=document.querySelector('#app main');if(!product||!main)return;main.innerHTML=`<header class="top"><div><div class="eyebrow">Livestock products</div><button class="back-link" id="back-to-products">← Back to product library</button><h1>${product.icon} ${safe(product.name)}</h1><p>${safe(product.animals)}</p></div></header><div class="product-guide"><section class="card product-guide-main"><h2>How it is made</h2><ol class="product-steps">${product.steps.map(step=>`<li>${safe(step)}</li>`).join('')}</ol><div class="product-callout"><strong>Why it matters</strong><br>${safe(product.importance)}</div></section><aside class="card product-guide-aside"><div class="product-detail-icon">${product.icon}</div><h2>About this product</h2><p>${safe(product.summary)}</p><div class="product-safety"><strong>Important consideration</strong><br>${safe(product.considerations)}</div><button class="button primary" id="ask-aashu-product" style="margin-top:15px">Ask Aashu about this product</button></aside></div><p class="footer">Guidance is educational. Follow local food safety, waste handling, environmental, energy, and licensing requirements before producing or selling livestock products.</p>`;document.getElementById('back-to-products').onclick=showLivestock;document.getElementById('ask-aashu-product').onclick=()=>window.HerdCareAashu?.ask(`Tell me the key health, animal-welfare, hygiene, and safety questions I should consider for ${product.name}.`)}
      function showLivestock(){const main=document.querySelector('#app main');if(!main)return;const navButton=document.querySelector('[data-livestock-page]');if(navButton)setNav(navButton);main.innerHTML=`<header class="top"><div><div class="eyebrow">Farm value & circular resources</div><h1>Livestock</h1><p>Explore products from animal husbandry and responsibly managed farm by-products.</p></div></header><div class="livestock-intro"><span>♻</span><div><b>From animal care to useful products</b><p>Explore food, fibre, soil-input, and energy pathways—designed around animal welfare, hygiene, and responsible waste management.</p></div></div><div class="livestock-filter" id="livestock-filter">${['All','Food','Materials','Farm input','Energy'].map(category=>`<button class="${category==='All'?'active':''}" data-product-category="${category}">${category}</button>`).join('')}</div><section class="product-grid" id="product-grid"></section><p class="footer">These templates are educational starting points, not operating procedures. Confirm local rules, safety requirements, and professional advice before producing or selling products.</p>`;document.querySelectorAll('[data-product-category]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-product-category]').forEach(item=>item.classList.toggle('active',item===button));renderCards(button.dataset.productCategory)});renderCards('All')}

      new MutationObserver(addNav).observe(document.getElementById('app'),{childList:true,subtree:true});addNav();
