  <script>
    (()=>{
      const copy={
        en:{back:'← Back to HerdCare',eyebrow:'OBSERVATION MANUAL',title:'Behaviour changes to notice',lead:'Use changes from an animal’s normal routine as an early prompt to observe closely and contact a veterinarian. Behaviour can signal discomfort or illness, but it cannot confirm a diagnosis.',noticeTitle:'Start with that animal’s usual pattern.',notice:'Age, weather, handling, a new environment and reproduction can also change behaviour. Look for a clear change, how long it lasts, and whether it is getting worse.',cattle:'Cattle & buffalo',pets:'Dogs & cats',cattleSignals:[['Feed, water & rumination','Eating or drinking less, leaving feed, reduced cud-chewing, or staying apart from the group can be early warning signs.'],['Movement, posture & resting','Reluctance to rise or walk, a stiff stance, limping, repeated lying and rising, or unusual resting can indicate discomfort.'],['Social & production changes','Dullness, isolation, unusual agitation, reduced response to people, or a sudden milk-yield change are worth recording.']],petSignals:[['Routine & social changes','Hiding, withdrawal, unusual clinginess, less play, sleep changes, or a sudden temperament change can matter.'],['Food, water & toileting','Changes in appetite, thirst, urination, defecation, litter-box use, or house-training should be noted.'],['Movement, grooming & response','Limping, reluctance to jump, less grooming, unusual vocalisation, sensitivity to touch, fear, or aggression can accompany pain or illness.']],actionTitle:'What to do next',action:'Observe quietly, compare with the animal’s usual routine, and record what changed. Keep fresh water available and avoid giving human medicines or changing prescribed treatment without veterinary advice.',checks:[['When','Date, time and duration of the change'],['Baseline','What is normal for this animal?'],['Changes','Food, water, rumination, toilet habits, movement, rest and social behaviour'],['Context','Recent feed, weather, travel, breeding, handling or household changes'],['Visible signs','Breathing, discharge, swelling, wounds, manure or vomiting'],['Evidence','A clear photo/video, temperature or milk-yield record if safe to obtain']],urgentTitle:'Contact a veterinarian urgently',urgent:['Difficulty breathing, collapse, seizures, severe or constant pain, heavy bleeding, or an animal that cannot stand or walk normally.','Cattle with severe bloat, difficult calving, rapid/laboured breathing, or a calf that will not drink.','Dogs or cats with trouble breathing, repeated unsuccessful attempts to urinate, uncontrolled vomiting/diarrhoea, or inability to eat or drink.'],recordTitle:'A brief observation record helps',sources:'This is an observation aid, not a diagnostic tool. Read the guidance from ',source1:'GOV.UK on cattle health',source2:'Merck Veterinary Manual on pet health',and:' and ',source3:'when to see a veterinarian','.':'.'},
        hi:{back:'← हर्डकेयर पर वापस',eyebrow:'अवलोकन मार्गदर्शिका',title:'व्यवहार में बदलाव पहचानें',lead:'पशु की सामान्य दिनचर्या में बदलाव को ध्यान से देखने और पशु चिकित्सक से संपर्क करने के शुरुआती संकेत की तरह उपयोग करें। व्यवहार असुविधा या बीमारी का संकेत दे सकता है, लेकिन निदान की पुष्टि नहीं कर सकता।',noticeTitle:'उस पशु के सामान्य पैटर्न से शुरुआत करें।',notice:'उम्र, मौसम, संभालने का तरीका, नया वातावरण और प्रजनन भी व्यवहार बदल सकते हैं। स्पष्ट बदलाव, उसकी अवधि और स्थिति बिगड़ रही है या नहीं, यह देखें।',cattle:'गाय, भैंस और अन्य मवेशी',pets:'कुत्ते और बिल्लियाँ',cattleSignals:[['चारा, पानी और जुगाली','कम खाना या पानी पीना, चारा छोड़ना, कम जुगाली करना या झुंड से अलग रहना शुरुआती संकेत हो सकते हैं।'],['चलना, मुद्रा और आराम','उठने या चलने में अनिच्छा, अकड़ी मुद्रा, लंगड़ाहट, बार-बार लेटना-उठना या असामान्य आराम असुविधा दिखा सकता है।'],['सामाजिक और उत्पादन बदलाव','सुस्ती, अलगाव, असामान्य बेचैनी, लोगों के प्रति कम प्रतिक्रिया या दूध उत्पादन में अचानक बदलाव दर्ज करें।']],petSignals:[['दिनचर्या और सामाजिक बदलाव','छिपना, अलग रहना, असामान्य चिपकना, कम खेलना, नींद में बदलाव या अचानक स्वभाव बदलना महत्वपूर्ण हो सकता है।'],['खाना, पानी और शौच','भूख, प्यास, पेशाब, मल, लिटर-बॉक्स उपयोग या घर में शौच की आदत में बदलाव नोट करें।'],['चलना, संवारना और प्रतिक्रिया','लंगड़ाहट, कूदने में अनिच्छा, कम संवारना, असामान्य आवाज़, छूने पर संवेदनशीलता, डर या आक्रामकता दर्द या बीमारी के साथ हो सकती है।']],actionTitle:'अगला कदम',action:'शांतिपूर्वक देखें, सामान्य दिनचर्या से तुलना करें और क्या बदला दर्ज करें। ताज़ा पानी उपलब्ध रखें और पशु चिकित्सक की सलाह के बिना मानव दवा न दें या तय उपचार न बदलें।',checks:[['कब','बदलाव की तारीख, समय और अवधि'],['सामान्य स्थिति','इस पशु के लिए क्या सामान्य है?'],['बदलाव','चारा, पानी, जुगाली, शौच, चलना, आराम और सामाजिक व्यवहार'],['संदर्भ','हाल का चारा, मौसम, यात्रा, प्रजनन, संभालना या घर का बदलाव'],['दिखने वाले संकेत','साँस, स्राव, सूजन, घाव, गोबर या उल्टी'],['प्रमाण','यदि सुरक्षित हो तो साफ फोटो/वीडियो, तापमान या दूध उत्पादन रिकॉर्ड']],urgentTitle:'तुरंत पशु चिकित्सक से संपर्क करें',urgent:['साँस लेने में कठिनाई, गिरना, दौरे, गंभीर या लगातार दर्द, बहुत रक्तस्राव, या ऐसा पशु जो सामान्य रूप से खड़ा या चल नहीं सकता।','गंभीर अफारा, कठिन प्रसव, तेज़/कठिन साँस या दूध न पीने वाले बछड़े वाले मवेशी।','साँस की समस्या, पेशाब की बार-बार असफल कोशिश, अनियंत्रित उल्टी/दस्त, या खाने-पीने में असमर्थ कुत्ते या बिल्लियाँ।'],recordTitle:'संक्षिप्त अवलोकन रिकॉर्ड मदद करता है',sources:'यह अवलोकन सहायता है, निदान उपकरण नहीं। देखें ',source1:'मवेशी स्वास्थ्य पर GOV.UK मार्गदर्शन',source2:'पालतू स्वास्थ्य पर Merck पशु चिकित्सा मार्गदर्शिका',and:' और ',source3:'पशु चिकित्सक से कब मिलें','.':'.'},
        bn:{back:'← হার্ডকেয়ারে ফিরে যান',eyebrow:'পর্যবেক্ষণ নির্দেশিকা',title:'আচরণের পরিবর্তন লক্ষ করুন',lead:'প্রাণীর স্বাভাবিক রুটিনের পরিবর্তনকে নিবিড় পর্যবেক্ষণ ও পশু চিকিৎসকের সঙ্গে যোগাযোগের প্রাথমিক সংকেত হিসেবে ব্যবহার করুন। আচরণ অস্বস্তি বা অসুস্থতার ইঙ্গিত দিতে পারে, কিন্তু রোগ নির্ণয় নিশ্চিত করতে পারে না।',noticeTitle:'প্রাণীটির স্বাভাবিক ধরণ দিয়ে শুরু করুন।',notice:'বয়স, আবহাওয়া, পরিচর্যা, নতুন পরিবেশ এবং প্রজননও আচরণ বদলাতে পারে। স্পষ্ট পরিবর্তন, তা কতক্ষণ থাকে এবং খারাপ হচ্ছে কি না লক্ষ্য করুন।',cattle:'গবাদি পশু ও মহিষ',pets:'কুকুর ও বিড়াল',cattleSignals:[['খাদ্য, পানি ও জাবর কাটা','কম খাওয়া বা পানি পান, খাদ্য ছেড়ে দেওয়া, কম জাবর কাটা বা পাল থেকে আলাদা থাকা প্রাথমিক সংকেত হতে পারে।'],['চলাচল, ভঙ্গি ও বিশ্রাম','উঠতে বা হাঁটতে অনীহা, শক্ত ভঙ্গি, খোঁড়া, বারবার শোয়া-ওঠা বা অস্বাভাবিক বিশ্রাম অস্বস্তির ইঙ্গিত দিতে পারে।'],['সামাজিক ও উৎপাদনের পরিবর্তন','নিস্তেজতা, বিচ্ছিন্নতা, অস্বাভাবিক অস্থিরতা, মানুষের প্রতি কম সাড়া বা দুধের ফলনে হঠাৎ পরিবর্তন নথিভুক্ত করুন।']],petSignals:[['রুটিন ও সামাজিক পরিবর্তন','লুকিয়ে থাকা, আলাদা হয়ে যাওয়া, অস্বাভাবিকভাবে লেগে থাকা, কম খেলা, ঘুমের পরিবর্তন বা আচমকা স্বভাব বদল গুরুত্বপূর্ণ হতে পারে।'],['খাদ্য, পানি ও শৌচ','ক্ষুধা, তৃষ্ণা, প্রস্রাব, মল, লিটার-বক্স ব্যবহার বা ঘরে শৌচের অভ্যাসের পরিবর্তন নোট করুন।'],['চলাচল, পরিচর্যা ও প্রতিক্রিয়া','খোঁড়া, লাফ দিতে অনীহা, কম পরিচর্যা, অস্বাভাবিক শব্দ, স্পর্শে সংবেদনশীলতা, ভয় বা আক্রমণাত্মকতা ব্যথা বা অসুস্থতার সাথে থাকতে পারে।']],actionTitle:'পরবর্তী পদক্ষেপ',action:'শান্তভাবে পর্যবেক্ষণ করুন, স্বাভাবিক রুটিনের সঙ্গে তুলনা করুন এবং কী বদলেছে লিখুন। পরিষ্কার পানি দিন এবং পশু চিকিৎসকের পরামর্শ ছাড়া মানুষের ওষুধ দেবেন না বা নির্ধারিত চিকিৎসা বদলাবেন না।',checks:[['কখন','পরিবর্তনের তারিখ, সময় ও স্থায়িত্ব'],['স্বাভাবিক অবস্থা','এই প্রাণীর জন্য কী স্বাভাবিক?'],['পরিবর্তন','খাদ্য, পানি, জাবর কাটা, শৌচ, চলাচল, বিশ্রাম ও সামাজিক আচরণ'],['প্রেক্ষাপট','সাম্প্রতিক খাদ্য, আবহাওয়া, ভ্রমণ, প্রজনন, পরিচর্যা বা বাড়ির পরিবর্তন'],['দৃশ্যমান লক্ষণ','শ্বাস, স্রাব, ফোলা, ক্ষত, গ
